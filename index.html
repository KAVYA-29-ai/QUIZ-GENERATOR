<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>QuizGen Pro — AI Study Assistant</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="/apple-polish.css" />
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const {useEffect, useMemo, useRef, useState} = React;
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const DEFAULT_TYPES = {mcq: 5, truefalse: 3, short: 2};
    const DEFAULT_DIFFICULTY = {easy: 3, medium: 4, hard: 2, expert: 1};

    const normalizeQuestion = (q, i) => {
      const type = q.type === 'tf' ? 'truefalse' : q.type;
      return {
        id: q.id ?? i + 1,
        type: ['mcq','truefalse','short'].includes(type) ? type : 'mcq',
        question: q.question || `Question ${i + 1}`,
        options: type === 'mcq' ? (Array.isArray(q.options) && q.options.length === 4 ? q.options : ['Option A','Option B','Option C','Option D']) : type === 'truefalse' ? ['True','False'] : [],
        correct: q.correct || 'A',
        answer: q.answer || '',
        difficulty: q.difficulty || 'medium',
        explanation: q.explanation || 'Review the source material for the reasoning.',
        sampleAnswer: q.sampleAnswer || ''
      };
    };

    function App(){
      const [tab,setTab] = useState('generate');
      const [content,setContent] = useState(localStorage.getItem('quizgen_content') || '');
      const [files,setFiles] = useState([]);
      const [questions,setQuestions] = useState(()=>JSON.parse(localStorage.getItem('quizgen_questions') || '[]'));
      const [flashcards,setFlashcards] = useState(()=>JSON.parse(localStorage.getItem('quizgen_flashcards') || '[]'));
      const [summary,setSummary] = useState(localStorage.getItem('quizgen_summary') || '');
      const [types,setTypes] = useState(DEFAULT_TYPES);
      const [difficulty,setDifficulty] = useState(DEFAULT_DIFFICULTY);
      const [loading,setLoading] = useState(false);
      const [status,setStatus] = useState('');
      const [error,setError] = useState('');
      const [drag,setDrag] = useState(false);
      const [flipped,setFlipped] = useState(new Set());
      const [quizIndex,setQuizIndex] = useState(0);
      const [answers,setAnswers] = useState({});
      const [score,setScore] = useState(null);
      const fileRef = useRef(null);

      useEffect(()=>localStorage.setItem('quizgen_content',content),[content]);
      useEffect(()=>localStorage.setItem('quizgen_questions',JSON.stringify(questions)),[questions]);
      useEffect(()=>localStorage.setItem('quizgen_flashcards',JSON.stringify(flashcards)),[flashcards]);
      useEffect(()=>localStorage.setItem('quizgen_summary',summary),[summary]);

      const totalQuestions = Object.values(types).reduce((a,b)=>a+b,0);
      const current = questions[quizIndex];
      const progress = questions.length ? Math.round(((quizIndex+1)/questions.length)*100) : 0;

      const readPdf = async(file)=>{
        const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
        let text='';
        for(let p=1;p<=pdf.numPages;p++){
          const page=await pdf.getPage(p);
          const data=await page.getTextContent();
          text += data.items.map(x=>x.str).join(' ') + '\n\n';
        }
        return text.trim();
      };

      const handleFiles = async(list)=>{
        setError(''); setLoading(true);
        try{
          let combined=content; const accepted=[];
          for(const file of list){
            if(!/\.(pdf|txt|md)$/i.test(file.name)) throw new Error(`${file.name}: PDF, TXT or MD only.`);
            const text=file.type==='application/pdf' || /\.pdf$/i.test(file.name) ? await readPdf(file) : await file.text();
            combined += `${combined ? '\n\n' : ''}--- ${file.name} ---\n${text}`;
            accepted.push({name:file.name,size:file.size});
          }
          setContent(combined.slice(0,30000)); setFiles(prev=>[...prev,...accepted]);
          setStatus(`${accepted.length} file${accepted.length===1?'':'s'} loaded.`);
        }catch(e){setError(e.message)}finally{setLoading(false)}
      };

      const generate = async()=>{
        if(!content.trim()){setError('Add text or upload a file first.');return}
        setLoading(true); setError(''); setStatus('Generating with Gemini…');
        try{
          const res=await fetch('/.netlify/functions/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,type:'questions',config:{questionTypes:types,difficultyDistribution:difficulty}})});
          const data=await res.json();
          if(!res.ok || !data.success) throw new Error(data.error || 'Generation failed.');
          const d=data.data || data;
          const qs=(d.questions||[]).map(normalizeQuestion);
          setQuestions(qs); setSummary(d.summary||''); setFlashcards(d.flashcards||[]); setTab('materials'); setStatus(`${qs.length} questions generated.`);
          setAnswers({}); setScore(null); setQuizIndex(0);
        }catch(e){
          setError(e.message); setStatus('');
        }finally{setLoading(false)}
      };

      const choose=(answer)=>setAnswers(a=>({...a,[current.id]:answer}));
      const finish=()=>{
        let s=0;
        questions.forEach(q=>{
          const a=answers[q.id];
          if(q.type==='short'){
            const target=(q.sampleAnswer||q.answer||'').toLowerCase().trim();
            const given=String(a||'').toLowerCase().trim();
            if(given && target && (target.includes(given)||given.includes(target))) s++;
          }else if(a===q.correct) s++;
        });
        setScore(s); setTab('results');
      };

      const exportTxt=()=>{
        const text=questions.map((q,i)=>`${i+1}. ${q.question}\nAnswer: ${q.type==='mcq'?q.options['ABCD'.indexOf(q.correct)]||q.correct:q.correct||q.sampleAnswer}\n`).join('\n');
        const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'})); a.download='quizgen-questions.txt'; a.click();
      };
      const exportPdf=()=>{
        const {jsPDF}=window.jspdf; const doc=new jsPDF(); let y=24;
        doc.setFontSize(18); doc.text('QuizGen Pro — Generated Questions',14,y); y+=12; doc.setFontSize(10);
        questions.forEach((q,i)=>{
          const text=`${i+1}. ${q.question}\nAnswer: ${q.type==='mcq'?q.options['ABCD'.indexOf(q.correct)]||q.correct:q.correct||q.sampleAnswer}`;
          const lines=doc.splitTextToSize(text,180); if(y+lines.length*5>285){doc.addPage();y=20} doc.text(lines,14,y); y+=lines.length*5+7;
        }); doc.save('quizgen-questions.pdf');
      };

      return <div className="app-shell">
        <header className="topbar glass">
          <div className="brand"><span className="brand-mark">Q</span><div><strong>QuizGen Pro</strong><small>AI study workspace</small></div></div>
          <div className="top-actions"><span className="status-dot"></span><span>Ready</span></div>
        </header>

        <main className="main">
          <section className="hero">
            <div className="eyebrow">AI-POWERED LEARNING</div>
            <h1>Turn your notes into<br/><span>better questions.</span></h1>
            <p>Upload a PDF, paste your notes, and build a focused study session in seconds.</p>
          </section>

          <nav className="tabs glass" aria-label="QuizGen sections">
            {[['generate','Create'],['materials','Materials'],['quiz','Quiz'],['results','Results']].map(([id,label])=><button key={id} className={tab===id?'active':''} disabled={(id!=='generate'&&id!=='materials'&&questions.length===0)} onClick={()=>setTab(id)}>{label}</button>)}
          </nav>

          {error && <div className="notice error">{error}<button onClick={()=>setError('')}>×</button></div>}
          {status && <div className="notice success">{status}</div>}

          {tab==='generate' && <section className="workspace grid-main">
            <div className="panel glass">
              <div className="panel-head"><div><span className="kicker">01</span><h2>Source material</h2></div><span className="muted">{content.length.toLocaleString()} chars</span></div>
              <div className={`dropzone ${drag?'drag':''}`} onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);handleFiles([...e.dataTransfer.files])}} onClick={()=>fileRef.current?.click()}>
                <div className="upload-icon">↑</div><strong>Drop files here</strong><span>PDF, TXT, MD · or click to browse</span><input ref={fileRef} hidden type="file" multiple accept=".pdf,.txt,.md" onChange={e=>handleFiles([...e.target.files])}/>
              </div>
              {files.length>0 && <div className="file-row">{files.map((f,i)=><span key={i} className="chip">{f.name}</span>)}</div>}
              <textarea value={content} onChange={e=>setContent(e.target.value)} placeholder="Or paste your study notes here…" />
            </div>
            <aside className="panel glass settings-panel">
              <div className="panel-head"><div><span className="kicker">02</span><h2>Session</h2></div><span className="count-badge">{totalQuestions}</span></div>
              <label>Question mix</label>
              {Object.entries(types).map(([k,v])=><div className="setting" key={k}><span>{k==='mcq'?'Multiple choice':k==='truefalse'?'True / False':'Short answer'}</span><input type="number" min="0" max="20" value={v} onChange={e=>setTypes(t=>({...t,[k]:Math.max(0,Math.min(20,+e.target.value||0))}))}/></div>)}
              <label>Difficulty</label>
              {Object.entries(difficulty).map(([k,v])=><div className="setting" key={k}><span>{k}</span><input type="number" min="0" max="20" value={v} onChange={e=>setDifficulty(d=>({...d,[k]:Math.max(0,Math.min(20,+e.target.value||0))}))}/></div>)}
              <button className="primary wide" disabled={loading||!content.trim()} onClick={generate}>{loading?'Generating…':'Generate materials'} <span>→</span></button>
            </aside>
          </section>}

          {tab==='materials' && <section className="materials">
            <div className="summary panel glass"><div className="panel-head"><div><span className="kicker">SUMMARY</span><h2>What you should know</h2></div><div className="actions"><button className="secondary" onClick={exportTxt}>TXT</button><button className="secondary" onClick={exportPdf}>PDF</button><button className="primary" onClick={()=>{setQuizIndex(0);setAnswers({});setScore(null);setTab('quiz')}}>Start quiz →</button></div></div><p>{summary||'No summary generated yet.'}</p></div>
            <div className="section-title"><span>QUESTIONS</span><strong>{questions.length}</strong></div>
            <div className="question-grid">{questions.map((q,i)=><article className="question-card glass" key={q.id}><div className="q-meta"><span>Q{i+1}</span><em>{q.difficulty}</em><em>{q.type}</em></div><h3>{q.question}</h3>{q.options.length>0&&<ol>{q.options.map((o,j)=><li key={j}><span>{String.fromCharCode(65+j)}</span>{o}</li>)}</ol>}<div className="explanation">{q.explanation}</div></article>)}</div>
            <div className="section-title"><span>FLASHCARDS</span><strong>{flashcards.length}</strong></div>
            <div className="card-grid">{flashcards.map(c=><div className={'flash glass '+(flipped.has(c.id)?'is-flipped':'')} key={c.id} onClick={()=>setFlipped(s=>{const n=new Set(s);n.has(c.id)?n.delete(c.id):n.add(c.id);return n})}><div className="face front"><small>{c.category}</small><h3>{c.front}</h3><span>Click to reveal</span></div><div className="face back"><h3>{c.front}</h3><p>{c.back}</p></div></div>)}</div>
          </section>}

          {tab==='quiz' && current && <section className="quiz panel glass"><div className="quiz-head"><span>Question {quizIndex+1} of {questions.length}</span><span>{progress}%</span></div><div className="progress"><i style={{width:progress+'%'}}></i></div><div className="quiz-body"><em>{current.difficulty}</em><h2>{current.question}</h2>{current.type==='short'?<textarea value={answers[current.id]||''} onChange={e=>choose(e.target.value)} placeholder="Type your answer…"/>:<div className="answers">{current.options.map((o,i)=><button key={i} className={answers[current.id]=== (current.type==='mcq'?String.fromCharCode(65+i):o)?'chosen':''} onClick={()=>choose(current.type==='mcq'?String.fromCharCode(65+i):o)}><span>{current.type==='mcq'?String.fromCharCode(65+i):i+1}</span>{o}</button>)}</div>}<div className="quiz-actions"><button className="secondary" disabled={quizIndex===0} onClick={()=>setQuizIndex(i=>i-1)}>Back</button>{quizIndex===questions.length-1?<button className="primary" onClick={finish}>Finish →</button>:<button className="primary" onClick={()=>setQuizIndex(i=>i+1)}>Next →</button>}</div></div></section>}

          {tab==='results' && <section className="results panel glass"><div className="result-ring"><strong>{score===null?'—':Math.round((score/questions.length)*100)+'%'}</strong><span>accuracy</span></div><h2>{score===null?'No attempt yet':score===questions.length?'Perfect session.':score/questions.length>=.7?'Strong work.':'Keep going.'}</h2><p>{score===null?'Complete a quiz to see your performance.':`${score} correct out of ${questions.length}. Review the explanations and try again.`}</p>{score!==null&&<button className="primary" onClick={()=>{setQuizIndex(0);setAnswers({});setScore(null);setTab('quiz')}}>Try again →</button>}</section>}
        </main>
        {loading&&<div className="loading"><div className="spinner"></div><strong>Working…</strong><span>Keep this window open.</span></div>}
      </div>
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
