<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizGen - AI Quiz Generator</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.js"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        overflow-x: hidden;
      }
      
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      
      .glass {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }
      
      .btn {
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 24px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }
      
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }
      
      .btn:active {
        transform: translateY(0);
      }
      
      .btn-secondary {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      
      .input-group {
        margin-bottom: 20px;
      }
      
      .input-group label {
        display: block;
        color: white;
        font-weight: 600;
        margin-bottom: 8px;
      }
      
      .input-group input,
      .input-group select,
      .input-group textarea {
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
        color: white;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
      }
      
      .input-group input:focus,
      .input-group select:focus,
      .input-group textarea:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
      }
      
      .input-group input::placeholder,
      .input-group textarea::placeholder {
        color: rgba(255, 255, 255, 0.7);
      }
      
      .progress-bar {
        width: 100%;
        height: 8px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        overflow: hidden;
        margin: 20px 0;
      }
      
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #667eea, #764ba2);
        transition: width 0.3s ease;
        border-radius: 4px;
      }
      
      .quiz-card {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 30px;
        margin-bottom: 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(20px);
      }
      
      .question-options {
        display: grid;
        gap: 15px;
        margin: 20px 0;
      }
      
      .option {
        padding: 15px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid transparent;
        cursor: pointer;
        transition: all 0.3s ease;
        color: white;
      }
      
      .option:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateX(5px);
      }
      
      .option.selected {
        border-color: #667eea;
        background: rgba(102, 126, 234, 0.2);
      }
      
      .option.correct {
        border-color: #4ade80;
        background: rgba(74, 222, 128, 0.2);
      }
      
      .option.incorrect {
        border-color: #ef4444;
        background: rgba(239, 68, 68, 0.2);
      }
      
      .floating-shapes {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
      }
      
      .shape {
        position: absolute;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        animation: float 6s ease-in-out infinite;
      }
      
      .shape:nth-child(1) {
        width: 80px;
        height: 80px;
        top: 20%;
        left: 10%;
        animation-delay: 0s;
      }
      
      .shape:nth-child(2) {
        width: 120px;
        height: 120px;
        top: 60%;
        right: 10%;
        animation-delay: 2s;
      }
      
      .shape:nth-child(3) {
        width: 100px;
        height: 100px;
        top: 80%;
        left: 30%;
        animation-delay: 4s;
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
      }
      
      .fade-in {
        animation: fadeIn 0.6s ease-in-out;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .slide-in {
        animation: slideIn 0.6s ease-out;
      }
      
      @keyframes slideIn {
        from { transform: translateX(-100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      
      .success-badge {
        background: linear-gradient(45deg, #4ade80, #22c55e);
        color: white;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
        display: inline-block;
        margin: 10px 0;
      }
      
      .error-badge {
        background: linear-gradient(45deg, #ef4444, #dc2626);
        color: white;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
        display: inline-block;
        margin: 10px 0;
      }
      
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin: 20px 0;
      }
      
      .stat-card {
        background: rgba(255, 255, 255, 0.1);
        padding: 20px;
        border-radius: 15px;
        text-align: center;
        color: white;
        backdrop-filter: blur(10px);
      }
      
      .stat-number {
        font-size: 2.5rem;
        font-weight: bold;
        background: linear-gradient(45deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 5px;
      }
      
      .file-drop {
        border: 2px dashed rgba(255, 255, 255, 0.5);
        border-radius: 15px;
        padding: 40px;
        text-align: center;
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
        margin: 20px 0;
      }
      
      .file-drop:hover {
        border-color: #667eea;
        background: rgba(102, 126, 234, 0.1);
      }
      
      .file-drop.drag-over {
        border-color: #4ade80;
        background: rgba(74, 222, 128, 0.1);
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .tooltip {
        position: relative;
        display: inline-block;
      }
      
      .tooltip::after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: 125%;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 14px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        z-index: 1000;
      }
      
      .tooltip:hover::after {
        opacity: 1;
      }
      
      .help-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      
      .help-content {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 40px;
        max-width: 600px;
        max-height: 80vh;
        overflow-y: auto;
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      
      .tab-buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      
      .tab-button {
        padding: 10px 20px;
        border: none;
        border-radius: 25px;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 500;
      }
      
      .tab-button.active {
        background: linear-gradient(45deg, #667eea, #764ba2);
        transform: scale(1.05);
      }
      
      .header {
        text-align: center;
        margin-bottom: 40px;
        color: white;
      }
      
      .header h1 {
        font-size: 3rem;
        font-weight: bold;
        background: linear-gradient(45deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
        animation: glow 2s ease-in-out infinite alternate;
      }
      
      @keyframes glow {
        from { text-shadow: 0 0 20px rgba(102, 126, 234, 0.5); }
        to { text-shadow: 0 0 30px rgba(118, 75, 162, 0.8), 0 0 40px rgba(118, 75, 162, 0.3); }
      }
      
      .header p {
        font-size: 1.2rem;
        opacity: 0.9;
      }
      
      @media (max-width: 768px) {
        .container { padding: 10px; }
        .header h1 { font-size: 2rem; }
        .stats-grid { grid-template-columns: 1fr; }
        .tab-buttons { justify-content: center; }
        .help-content { padding: 20px; margin: 20px; }
      }
    </style>
  </head>
  <body>
    <div class="floating-shapes">
      <div class="shape"></div>
      <div class="shape"></div>
      <div class="shape"></div>
    </div>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;
      const { motion, AnimatePresence } = Motion;
      const { 
        Upload, FileText, HelpCircle, Download, Play, 
        CheckCircle, XCircle, Trophy, TrendingUp, 
        Book, Lightbulb, Settings, Home
      } = LucideReact;

      const QuizGen = () => {
        const [activeTab, setActiveTab] = useState('upload');
        const [files, setFiles] = useState([]);
        const [content, setContent] = useState('');
        const [questions, setQuestions] = useState([]);
        const [currentQuiz, setCurrentQuiz] = useState(null);
        const [currentQuestion, setCurrentQuestion] = useState(0);
        const [answers, setAnswers] = useState({});
        const [score, setScore] = useState(0);
        const [streak, setStreak] = useState(0);
        const [difficulty, setDifficulty] = useState('medium');
        const [questionCount, setQuestionCount] = useState(5);
        const [loading, setLoading] = useState(false);
        const [showResults, setShowResults] = useState(false);
        const [performance, setPerformance] = useState({});
        const [showHelp, setShowHelp] = useState(false);
        const [topic, setTopic] = useState('');
        const [mode, setMode] = useState('quiz'); // quiz, summary, extract
        const [generatedContent, setGeneratedContent] = useState('');
        const fileInputRef = useRef(null);

        // File upload handlers
        const handleFileUpload = async (uploadedFiles) => {
          setLoading(true);
          const fileContents = [];
          
          for (const file of uploadedFiles) {
            try {
              if (file.type === 'text/plain') {
                const text = await file.text();
                fileContents.push({ name: file.name, content: text, type: 'text' });
              } else if (file.type === 'text/csv') {
                const text = await file.text();
                const parsed = Papa.parse(text, { header: true });
                const csvContent = parsed.data.map(row => Object.values(row).join(' ')).join('\n');
                fileContents.push({ name: file.name, content: csvContent, type: 'csv' });
              } else if (file.type === 'application/pdf') {
                // For PDF, we'll use a simple text extraction approach
                const text = await file.text();
                fileContents.push({ name: file.name, content: text, type: 'pdf' });
              }
            } catch (error) {
              console.error('Error processing file:', error);
            }
          }
          
          setFiles(prev => [...prev, ...fileContents]);
          const combinedContent = fileContents.map(f => f.content).join('\n\n');
          setContent(prev => prev + '\n\n' + combinedContent);
          setLoading(false);
        };

        // Generate content using AI
        const generateContent = async (type = 'quiz') => {
          if (!content.trim()) {
            alert('Please provide content or upload files first!');
            return;
          }

          setLoading(true);
          try {
            const response = await fetch('/.netlify/functions/generate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                content: content.slice(0, 8000), // Limit content size
                type,
                difficulty,
                questionCount: type === 'quiz' ? questionCount : undefined,
                topic: type === 'extract' ? topic : undefined
              })
            });

            const result = await response.json();
            
            if (result.success) {
              if (type === 'quiz') {
                try {
                  const quizData = JSON.parse(result.data);
                  setQuestions(quizData.questions || []);
                  setActiveTab('quiz');
                } catch {
                  // Fallback if JSON parsing fails
                  const fallbackQuestions = generateFallbackQuestions(content, questionCount);
                  setQuestions(fallbackQuestions);
                  setActiveTab('quiz');
                }
              } else {
                setGeneratedContent(result.data);
                setActiveTab('content');
              }
            } else {
              // Fallback generation
              if (type === 'quiz') {
                const fallbackQuestions = generateFallbackQuestions(content, questionCount);
                setQuestions(fallbackQuestions);
                setActiveTab('quiz');
              }
            }
          } catch (error) {
            console.error('Generation failed:', error);
            // Always provide fallback
            if (type === 'quiz') {
              const fallbackQuestions = generateFallbackQuestions(content, questionCount);
              setQuestions(fallbackQuestions);
              setActiveTab('quiz');
            }
          }
          setLoading(false);
        };

        // Fallback question generation (70% accuracy)
        const generateFallbackQuestions = (text, count) => {
          const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 10);
          const words = text.split(' ').filter(w => w.length > 4);
          const questions = [];

          for (let i = 0; i < Math.min(count, 10); i++) {
            const questionTypes = ['mcq', 'truefalse', 'short'];
            const type = questionTypes[i % 3];
            const randomSentence = sentences[Math.floor(Math.random() * sentences.length)];
            const randomWord = words[Math.floor(Math.random() * words.length)];

            let question = {
              id: i + 1,
              type,
              difficulty,
              explanation: 'Generated from content analysis'
            };

            if (type === 'mcq') {
              question.question = `What is the main concept related to "${randomWord}" in the content?`;
              question.options = [
                `A) Primary concept and key element`,
                `B) Secondary supporting detail`,
                `C) Unrelated information`,
                `D) Background context only`
              ];
              question.correct = 'A';
            } else if (type === 'truefalse') {
              question.question = `The content discusses "${randomWord}" as an important topic.`;
              question.options = ['True', 'False'];
              question.correct = text.toLowerCase().includes(randomWord.toLowerCase()) ? 'True' : 'False';
            } else {
              question.question = `Explain the significance of "${randomWord}" based on the content.`;
              question.type = 'short';
            }

            questions.push(question);
          }

          return questions;
        };

        // Quiz functions
        const startQuiz = () => {
          if (questions.length === 0) return;
          setCurrentQuiz(questions);
          setCurrentQuestion(0);
          setAnswers({});
          setScore(0);
          setStreak(0);
          setShowResults(false);
          setActiveTab('quiz-active');
        };

        const selectAnswer = (answer) => {
          const questionId = currentQuiz[currentQuestion].id;
          setAnswers(prev => ({ ...prev, [questionId]: answer }));
        };

        const nextQuestion = () => {
          const current = currentQuiz[currentQuestion];
          const userAnswer = answers[current.id];
          const isCorrect = userAnswer === current.correct;

          if (isCorrect) {
            setScore(prev => prev + 1);
            setStreak(prev => {
              const newStreak = prev + 1;
              // Increase difficulty after 3 correct in a row
              if (newStreak >= 3 && difficulty === 'easy') {
                setDifficulty('medium');
              } else if (newStreak >= 5 && difficulty === 'medium') {
                setDifficulty('hard');
              }
              return newStreak;
            });
          } else {
            setStreak(0);
            // Decrease difficulty after wrong answer
            if (difficulty === 'hard') {
              setDifficulty('medium');
            } else if (difficulty === 'medium') {
              setDifficulty('easy');
            }
          }

          // Record performance
          setPerformance(prev => ({
            ...prev,
            [current.id]: {
              question: current.question,
              userAnswer,
              correct: current.correct,
              isCorrect,
              difficulty: current.difficulty,
              rating: 'good' // Default rating
            }
          }));

          if (currentQuestion < currentQuiz.length - 1) {
            setCurrentQuestion(prev => prev + 1);
          } else {
            setShowResults(true);
            setActiveTab('results');
          }
        };

        const rateQuestion = (questionId, rating) => {
          setPerformance(prev => ({
            ...prev,
            [questionId]: { ...prev[questionId], rating }
          }));
        };

        // Export functions
        const exportResults = (format) => {
          const results = Object.values(performance);
          const scorePercent = ((score / questions.length) * 100).toFixed(1);
          
          if (format === 'txt') {
            const content = `Quiz Results - ${new Date().toLocaleDateString()}
            
Score: ${score}/${questions.length} (${scorePercent}%)
Difficulty: ${difficulty}
Max Streak: ${Math.max(...Object.values(performance).map((_, i) => streak))}

Questions Review:
${results.map((result, i) => `
${i + 1}. ${result.question}
Your Answer: ${result.userAnswer}
Correct Answer: ${result.correct}
Result: ${result.isCorrect ? '✓ Correct' : '✗ Incorrect'}
Rating: ${result.rating}
`).join('')}`;

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `quiz-results-${Date.now()}.txt`;
            a.click();
          } else if (format === 'pdf') {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(20);
            doc.text('Quiz Results', 20, 30);
            
            doc.setFontSize(12);
            doc.text(`Date: ${new Date().toLocaleDateString()}`, 20, 50);
            doc.text(`Score: ${score}/${questions.length} (${scorePercent}%)`, 20, 65);
            doc.text(`Difficulty: ${difficulty}`, 20, 80);
            
            let yPos = 100;
            results.forEach((result, i) => {
              if (yPos > 250) {
                doc.addPage();
                yPos = 30;
              }
              
              doc.text(`${i + 1}. ${result.question.slice(0, 60)}...`, 20, yPos);
              doc.text(`Answer: ${result.userAnswer} | Correct: ${result.correct}`, 20, yPos + 15);
              doc.text(`${result.isCorrect ? '✓ Correct' : '✗ Incorrect'} | Rating: ${result.rating}`, 20, yPos + 30);
              yPos += 50;
            });
            
            doc.save(`quiz-results-${Date.now()}.pdf`);
          }
        };

        // Drag and drop
        const handleDrop = (e) => {
          e.preventDefault();
          e.stopPropagation();
          const droppedFiles = Array.from(e.dataTransfer.files);
          handleFileUpload(droppedFiles);
        };

        const handleDragOver = (e) => {
          e.preventDefault();
          e.stopPropagation();
        };

        // Help modal content
        const HelpModal = () => (
          <div className="help-modal" onClick={() => setShowHelp(false)}>
            <div className="help-content" onClick={(e) => e.stopPropagation()}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                <h2>QuizGen Help Guide</h2>
                <button className="btn btn-secondary" onClick={() => setShowHelp(false)}>
                  ✕
                </button>
              </div>
              
              <div style={{ marginBottom: '20px' }}>
                <h3>🚀 Features</h3>
                <ul style={{ marginLeft: '20px', lineHeight: '1.8' }}>
                  <li><strong>Smart File Upload:</strong> Supports PDF, CSV, TXT files</li>
                  <li><strong>AI Quiz Generation:</strong> Uses Gemini AI with 70% backup accuracy</li>
                  <li><strong>Adaptive Difficulty:</strong> Adjusts based on your performance streak</li>
                  <li><strong>Multiple Question Types:</strong> MCQ, True/False, Short Answer</li>
                  <li><strong>Content Extraction:</strong> Focus on specific topics</li>
                  <li><strong>Performance Analytics:</strong> Track your learning progress</li>
                  <li><strong>Export Results:</strong> Download as TXT or PDF</li>
                </ul>
              </div>

              <div style={{ marginBottom: '20px' }}>
                <h3>🛠️ Technology Stack</h3>
                <ul style={{ marginLeft: '20px', lineHeight: '1.8' }}>
                  <li><strong>Frontend:</strong> React 18, Framer Motion animations</li>
                  <li><strong>Backend:</strong> Netlify Functions (serverless)</li>
                  <li><strong>AI:</strong> Google Gemini Pro API with fallback system</li>
                  <li><strong>Styling:</strong> Custom CSS with glassmorphism design</li>
                  <li><strong>File Processing:</strong> Papa Parse for CSV, built-in PDF support</li>
                </ul>
              </div>

              <div style={{ marginBottom: '20px' }}>
                <h3>📖 How to Use</h3>
                <ol style={{ marginLeft: '20px', lineHeight: '1.8' }}>
                  <li>Upload your study materials (PDF/CSV/TXT)</li>
                  <li>Or directly paste content into the text area</li>
                  <li>Select quiz settings (difficulty, question count)</li>
                  <li>Generate questions using AI</li>
                  <li>Take the adaptive quiz</li>
                  <li>Review performance and export results</li>
                </ol>
              </div>

              <div>
                <h3>💡 Pro Tips</h3>
                <ul style={{ marginLeft: '20px', lineHeight: '1.8' }}>
                  <li>Get 3 questions right in a row to increase difficulty</li>
                  <li>Use topic extraction for focused learning</li>
                  <li>Rate questions to improve future generations</li>
                  <li>Export results to track long-term progress</li>
                </ul>
              </div>
            </div>
          </div>
        );

        return (
          <div className="container">
            <div className="header fade-in">
              <h1>QuizGen</h1>
              <p>AI-Powered Adaptive Quiz Generator</p>
            </div>

            {/* Navigation */}
            <div className="glass" style={{ padding: '20px', marginBottom: '20px' }}>
              <div className="tab-buttons">
                <button 
                  className={`tab-button ${activeTab === 'upload' ? 'active' : ''}`}
                  onClick={() => setActiveTab('upload')}
                >
                  <Upload size={16} style={{ marginRight: '8px' }} />
                  Upload
                </button>
                <button 
                  className={`tab-button ${activeTab === 'content' ? 'active' : ''}`}
                  onClick={() => setActiveTab('content')}
                >
                  <FileText size={16} style={{ marginRight: '8px' }} />
                  Content
                </button>
                <button 
                  className={`tab-button ${activeTab === 'quiz' ? 'active' : ''}`}
                  onClick={() => setActiveTab('quiz')}
                >
                  <Play size={16} style={{ marginRight: '8px' }} />
                  Quiz
                </button>
                {showResults && (
                  <button 
                    className={`tab-button ${activeTab === 'results' ? 'active' : ''}`}
                    onClick={() => setActiveTab('results')}
                  >
                    <Trophy size={16} style={{ marginRight: '8px' }} />
                    Results
                  </button>
                )}
                <button 
                  className="tab-button"
                  onClick={() => setShowHelp(true)}
                >
                  <HelpCircle size={16} style={{ marginRight: '8px' }} />
                  Help
                </button>
              </div>
            </div>

            {/* Upload Tab */}
            {activeTab === 'upload' && (
              <motion.div 
                className="glass fade-in"
                style={{ padding: '30px' }}
                initial={{ opacity: 0, y: 20 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.6 }}
              >
                <h2 style={{ color: 'white', marginBottom: '20px' }}>📚 Upload Study Material</h2>
                
                {/* File Drop Zone */}
                <div 
                  className="file-drop"
                  onDrop={handleDrop}
                  onDragOver={handleDragOver}
                  onClick={() => fileInputRef.current?.click()}
                >
                  <Upload size={48} style={{ marginBottom: '15px', opacity: 0.7 }} />
                  <p>Drop files here or click to browse</p>
                  <p style={{ fontSize: '14px', opacity: 0.7 }}>
                    Supports: PDF, CSV, TXT files
                  </p>
                </div>
                
                <input
                  ref={fileInputRef}
                  type="file"
                  multiple
                  accept=".pdf,.csv,.txt"
                  style={{ display: 'none' }}
                  onChange={(e) => handleFileUpload(Array.from(e.target.files))}
                />

                {/* Direct Content Input */}
                <div className="input-group" style={{ marginTop: '30px' }}>
                  <label>📝 Or paste content directly:</label>
                  <textarea
                    value={content}
                    onChange={(e) => setContent(e.target.value)}
                    placeholder="Paste your study content here..."
                    rows={8}
                  />
                </div>

                {/* Files List */}
                {files.length > 0 && (
                  <div style={{ marginTop: '20px' }}>
                    <h3 style={{ color: 'white', marginBottom: '15px' }}>📄 Uploaded Files:</h3>
                    {files.map((file, index) => (
                      <div key={index} className="success-badge" style={{ display: 'block', margin: '10px 0' }}>
                        {file.name} ({file.type})
                      </div>
                    ))}
                  </div>
                )}

                {/* Generation Settings */}
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '20px', marginTop: '30px' }}>
                  <div className="input-group">
                    <label>🎯 Difficulty Level:</label>
                    <select value={difficulty} onChange={(e) => setDifficulty(e.target.value)}>
                      <option value="easy">Easy</option>
                      <option value="medium">Medium</option>
                      <option value="hard">Hard</option>
                    </select>
                  </div>

                  <div className="input-group">
                    <label>❓ Number of Questions:</label>
                    <select value={questionCount} onChange={(e) => setQuestionCount(parseInt(e.target.value))}>
                      <option value={5}>5 Questions</option>
                      <option value={10}>10 Questions</option>
                      <option value={15}>15 Questions</option>
                      <option value={20}>20 Questions</option>
                    </select>
                  </div>

                  <div className="input-group">
                    <label>🔍 Topic Focus (optional):</label>
                    <input
                      type="text"
                      value={topic}
                      onChange={(e) => setTopic(e.target.value)}
                      placeholder="e.g., machine learning"
                    />
                  </div>
                </div>

                {/* Action Buttons */}
                <div style={{ display: 'flex', gap: '15px', marginTop: '30px', flexWrap: 'wrap' }}>
                  <button 
                    className="btn" 
                    onClick={() => generateContent('quiz')}
                    disabled={loading || (!content.trim() && files.length === 0)}
                  >
                    {loading ? <div className="loading-spinner" style={{ width: '20px', height: '20px', margin: '0 10px 0 0' }} /> : '🎯'}
                    Generate Quiz
                  </button>
                  
                  <button 
                    className="btn btn-secondary" 
                    onClick={() => generateContent('summary')}
                    disabled={loading || (!content.trim() && files.length === 0)}
                  >
                    📋 Summarize
                  </button>
                  
                  <button 
                    className="btn btn-secondary" 
                    onClick={() => generateContent('extract')}
                    disabled={loading || (!content.trim() && files.length === 0) || !topic.trim()}
                  >
                    🔍 Extract Topic
                  </button>
                </div>
              </motion.div>
            )}

            {/* Content Display Tab */}
            {activeTab === 'content' && generatedContent && (
              <motion.div 
                className="glass"
                style={{ padding: '30px' }}
                initial={{ opacity: 0, y: 20 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.6 }}
              >
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                  <h2 style={{ color: 'white' }}>📄 Generated Content</h2>
                  <button 
                    className="btn btn-secondary"
                    onClick={() => {
                      const blob = new Blob([generatedContent], { type: 'text/plain' });
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement('a');
                      a.href = url;
                      a.download = `content-${Date.now()}.txt`;
                      a.click();
                    }}
                  >
                    <Download size={16} style={{ marginRight: '8px' }} />
                    Export
                  </button>
                </div>
                <div 
                  style={{ 
                    color: 'white', 
                    lineHeight: '1.8', 
                    whiteSpace: 'pre-wrap',
                    background: 'rgba(255, 255, 255, 0.1)',
                    padding: '20px',
                    borderRadius: '10px',
                    maxHeight: '600px',
                    overflowY: 'auto'
                  }}
                >
                  {generatedContent}
                </div>
              </motion.div>
            )}

            {/* Quiz Management Tab */}
            {activeTab === 'quiz' && (
              <motion.div 
                className="glass"
                style={{ padding: '30px' }}
                initial={{ opacity: 0, y: 20 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.6 }}
              >
                <h2 style={{ color: 'white', marginBottom: '20px' }}>🎯 Quiz Ready</h2>
                
                {questions.length > 0 ? (
                  <>
                    <div className="stats-grid">
                      <div className="stat-card">
                        <div className="stat-number">{questions.length}</div>
                        <div>Questions</div>
                      </div>
                      <div className="stat-card">
                        <div className="stat-number">{difficulty}</div>
                        <div>Difficulty</div>
                      </div>
                      <div className="stat-card">
                        <div className="stat-number">{streak}</div>
                        <div>Current Streak</div>
                      </div>
                    </div>
                    
                    <div style={{ marginTop: '30px' }}>
                      <h3 style={{ color: 'white', marginBottom: '15px' }}>📋 Question Preview:</h3>
                      {questions.slice(0, 3).map((q, index) => (
                        <div key={q.id} className="quiz-card" style={{ marginBottom: '15px' }}>
                          <p style={{ color: 'white', fontWeight: '600' }}>
                            {index + 1}. {q.question}
                          </p>
                          <p style={{ color: 'rgba(255,255,255,0.7)', fontSize: '14px', marginTop: '8px' }}>
                            Type: {q.type} | Difficulty: {q.difficulty}
                          </p>
                        </div>
                      ))}
                      {questions.length > 3 && (
                        <p style={{ color: 'rgba(255,255,255,0.7)', textAlign: 'center' }}>
                          +{questions.length - 3} more questions...
                        </p>
                      )}
                    </div>

                    <div style={{ textAlign: 'center', marginTop: '30px' }}>
                      <button className="btn" onClick={startQuiz} style={{ padding: '15px 30px', fontSize: '18px' }}>
                        🚀 Start Quiz
                      </button>
                    </div>
                  </>
                ) : (
                  <div style={{ textAlign: 'center', color: 'white', padding: '40px' }}>
                    <Book size={64} style={{ marginBottom: '20px', opacity: 0.5 }} />
                    <h3>No quiz generated yet</h3>
                    <p style={{ marginBottom: '20px', opacity: 0.8 }}>Upload content and generate questions to get started!</p>
                    <button className="btn" onClick={() => setActiveTab('upload')}>
                      📚 Go to Upload
                    </button>
                  </div>
                )}
              </motion.div>
            )}

            {/* Active Quiz Tab */}
            {activeTab === 'quiz-active' && currentQuiz && (
              <motion.div 
                className="glass"
                style={{ padding: '30px' }}
                initial={{ opacity: 0, scale: 0.95 }}
                animate={{ opacity: 1, scale: 1 }}
                transition={{ duration: 0.4 }}
              >
                {/* Progress Bar */}
                <div style={{ marginBottom: '30px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: 'white', marginBottom: '10px' }}>
                    <span>Question {currentQuestion + 1} of {currentQuiz.length}</span>
                    <span>Score: {score}/{currentQuiz.length}</span>
                  </div>
                  <div className="progress-bar">
                    <div 
                      className="progress-fill"
                      style={{ width: `${((currentQuestion + 1) / currentQuiz.length) * 100}%` }}
                    />
                  </div>
                  
                  {streak > 0 && (
                    <div className="success-badge" style={{ marginTop: '10px' }}>
                      🔥 {streak} streak! {streak >= 3 ? 'Difficulty increased!' : ''}
                    </div>
                  )}
                </div>

                {/* Current Question */}
                <div className="quiz-card">
                  <h3 style={{ color: 'white', marginBottom: '20px' }}>
                    {currentQuiz[currentQuestion].question}
                  </h3>
                  
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '20px' }}>
                    <span style={{ color: 'rgba(255,255,255,0.7)' }}>
                      Type: {currentQuiz[currentQuestion].type}
                    </span>
                    <span style={{ color: 'rgba(255,255,255,0.7)' }}>
                      Difficulty: {currentQuiz[currentQuestion].difficulty}
                    </span>
                  </div>

                  {/* Answer Options */}
                  {currentQuiz[currentQuestion].type !== 'short' ? (
                    <div className="question-options">
                      {currentQuiz[currentQuestion].options?.map((option, index) => (
                        <div
                          key={index}
                          className={`option ${answers[currentQuiz[currentQuestion].id] === option ? 'selected' : ''}`}
                          onClick={() => selectAnswer(option)}
                        >
                          {option}
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="input-group">
                      <textarea
                        placeholder="Type your answer here..."
                        value={answers[currentQuiz[currentQuestion].id] || ''}
                        onChange={(e) => selectAnswer(e.target.value)}
                        rows={4}
                      />
                    </div>
                  )}

                  {/* Navigation */}
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '30px' }}>
                    <button 
                      className="btn btn-secondary"
                      onClick={() => {
                        setActiveTab('quiz');
                        setCurrentQuiz(null);
                      }}
                    >
                      ← Back to Quiz
                    </button>
                    
                    <button 
                      className="btn"
                      onClick={nextQuestion}
                      disabled={!answers[currentQuiz[currentQuestion].id]}
                    >
                      {currentQuestion < currentQuiz.length - 1 ? 'Next Question →' : 'Finish Quiz 🏁'}
                    </button>
                  </div>
                </div>
              </motion.div>
            )}

            {/* Results Tab */}
            {activeTab === 'results' && showResults && (
              <motion.div 
                className="glass"
                style={{ padding: '30px' }}
                initial={{ opacity: 0, y: 20 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.6 }}
              >
                <div style={{ textAlign: 'center', marginBottom: '30px' }}>
                  <Trophy size={64} style={{ color: '#ffd700', marginBottom: '20px' }} />
                  <h2 style={{ color: 'white', marginBottom: '10px' }}>Quiz Completed! 🎉</h2>
                  <div className="success-badge" style={{ fontSize: '18px' }}>
                    Final Score: {score}/{questions.length} ({((score/questions.length)*100).toFixed(1)}%)
                  </div>
                </div>

                {/* Performance Stats */}
                <div className="stats-grid">
                  <div className="stat-card">
                    <div className="stat-number">{score}</div>
                    <div>Correct Answers</div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-number">{((score/questions.length)*100).toFixed(0)}%</div>
                    <div>Accuracy</div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-number">{Math.max(...Object.values(performance).map((_, i) => streak) || [0])}</div>
                    <div>Best Streak</div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-number">{difficulty}</div>
                    <div>Final Difficulty</div>
                  </div>
                </div>

                {/* Question Review */}
                <div style={{ marginTop: '30px' }}>
                  <h3 style={{ color: 'white', marginBottom: '20px' }}>📊 Detailed Review:</h3>
                  {Object.values(performance).map((result, index) => (
                    <div key={index} className="quiz-card" style={{ marginBottom: '15px' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '15px' }}>
                        <h4 style={{ color: 'white', flex: 1 }}>{index + 1}. {result.question}</h4>
                        {result.isCorrect ? 
                          <CheckCircle size={24} style={{ color: '#4ade80', marginLeft: '15px' }} /> :
                          <XCircle size={24} style={{ color: '#ef4444', marginLeft: '15px' }} />
                        }
                      </div>
                      
                      <div style={{ color: 'rgba(255,255,255,0.8)', marginBottom: '15px' }}>
                        <p><strong>Your Answer:</strong> {result.userAnswer}</p>
                        <p><strong>Correct Answer:</strong> {result.correct}</p>
                        <p><strong>Difficulty:</strong> {result.difficulty}</p>
                      </div>

                      {/* Question Rating */}
                      <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                        <span style={{ color: 'white' }}>Rate this question:</span>
                        {['good', 'okay', 'bad'].map(rating => (
                          <button
                            key={rating}
                            className={`btn ${result.rating === rating ? '' : 'btn-secondary'}`}
                            style={{ padding: '5px 10px', fontSize: '12px' }}
                            onClick={() => rateQuestion(Object.keys(performance)[index], rating)}
                          >
                            {rating === 'good' ? '👍' : rating === 'okay' ? '👌' : '👎'} {rating}
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>

                {/* Action Buttons */}
                <div style={{ display: 'flex', gap: '15px', marginTop: '30px', flexWrap: 'wrap', justifyContent: 'center' }}>
                  <button className="btn" onClick={() => exportResults('txt')}>
                    <Download size={16} style={{ marginRight: '8px' }} />
                    Export TXT
                  </button>
                  <button className="btn" onClick={() => exportResults('pdf')}>
                    <Download size={16} style={{ marginRight: '8px' }} />
                    Export PDF
                  </button>
                  <button className="btn btn-secondary" onClick={startQuiz}>
                    🔄 Retake Quiz
                  </button>
                  <button className="btn btn-secondary" onClick={() => {
                    setActiveTab('upload');
                    setQuestions([]);
                    setShowResults(false);
                  }}>
                    🆕 New Quiz
                  </button>
                </div>
              </motion.div>
            )}

            {/* Loading Overlay */}
            {loading && (
              <div style={{
                position: 'fixed',
                top: 0,
                left: 0,
                width: '100%',
                height: '100%',
                background: 'rgba(0, 0, 0, 0.8)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                zIndex: 1000
              }}>
                <div style={{ textAlign: 'center', color: 'white' }}>
                  <div className="loading-spinner" style={{ width: '60px', height: '60px', margin: '0 auto 20px' }} />
                  <h3>Generating content with AI...</h3>
                  <p style={{ opacity: 0.8 }}>This may take a few moments</p>
                </div>
              </div>
            )}

            {/* Help Modal */}
            <AnimatePresence>
              {showHelp && <HelpModal />}
            </AnimatePresence>
          </div>
        );
      };

      // Mount the app
      const root = ReactDOM.createRoot ? ReactDOM.createRoot(document.getElementById('root')) : ReactDOM;
      if (ReactDOM.createRoot) {
        root.render(React.createElement(QuizGen));
      } else {
        ReactDOM.render(React.createElement(QuizGen), document.getElementById('root'));
      }
    </script>
  </body>
</html>
