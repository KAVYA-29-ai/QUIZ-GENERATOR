<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>

            content: '';

        .btn-secondary {

        .header h1 {

        .flashcard {

        .flashcard:hover {

        .flashcard.flipped .flashcard-front {
            transform: rotateY(-180deg);

        .flashcard.flipped .flashcard-back {

        .flashcard-front,
        .flashcard-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            padding: 24px;
            display: flex;

        .flashcard-front {

        .flashcard-back {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.05));

        .flashcard-category {

        .quiz-question {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            animation: slideInRight 0.5s ease;

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }

        .option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }
        
        .option:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }
        
        .option.selected {
            background: rgba(79, 70, 229, 0.2);
            border-color: #4f46e5;
        }
        
        .option.correct {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
            animation: correctBounce 0.5s ease;
        }
        
        .option.incorrect {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            animation: incorrectShake 0.5s ease;
        }
        
        @keyframes correctBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        @keyframes incorrectShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 16px 0;

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;

        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;

            gap: 20px;
        }
        
        .loading-spinner {
            width: 48px;

        @keyframes spin {
            0% { transform: rotate(0deg); }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

        }
        
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;

        .difficulty-selector {

            padding: 16px;

        }
        
        .difficulty-selector:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .difficulty-input {
            width: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);

            padding: 8px;

            text-align: center;

        }
        
        .textarea-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;

            color: white;
            font-size: 14px;

            min-height: 120px;

        }
        
        .textarea-field:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .file-list {
            margin-top: 20px;
        }
        
        .file-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;

        }
        
        .file-info {
            display: flex;
            flex-direction: column;
        }
        
        .file-name {
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .file-size {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .remove-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 6px;
            color: #ef4444;
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .remove-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        
        @media (max-width: 768px) {
            .container { padding: 16px; }
            .header h1 { font-size: 2.5rem; }
            .tab-nav { flex-direction: column; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .grid-3 { grid-template-columns: 1fr; }
            .grid-4 { grid-template-columns: repeat(2, 1fr); }

    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const QuizGenPro = () => {
            const [activeTab, setActiveTab] = useState('upload');
            const [content, setContent] = useState('');
            const [files, setFiles] = useState([]);
            const [loading, setLoading] = useState(false);
            
            // Difficulty Settings
            const [difficultyDistribution, setDifficultyDistribution] = useState({
                easy: 3,
                medium: 4,
                hard: 2,
                expert: 1
            });
            
            const [questionTypes, setQuestionTypes] = useState({
                mcq: 6,
                short: 2,
                truefalse: 2
            });
            
            // Quiz State
            const [questions, setQuestions] = useState([]);
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [answers, setAnswers] = useState({});
            const [score, setScore] = useState(0);
            const [showResults, setShowResults] = useState(false);
            const [quizMode, setQuizMode] = useState(false);
            const [showAnswers, setShowAnswers] = useState(false);
            
            // Content State
            const [summary, setSummary] = useState('');
            const [flashcards, setFlashcards] = useState([]);
            const [flippedCards, setFlippedCards] = useState(new Set());
            
            const fileInputRef = useRef(null);
            
            // Enhanced PDF text extraction
            const extractTextFromPDF = async (file) => {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                    let fullText = '';
                    
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(' ');
                        fullText += pageText + '\n\n';
                    }
                    
                    return fullText.replace(/\s+/g, ' ').trim();
                } catch (error) {
                    throw new Error('Failed to extract text from PDF');
                }
            };
            
            // File upload handler
            const handleFileUpload = async (uploadedFiles) => {
                setLoading(true);
                const newFiles = [];
                let combinedContent = content;
                
                for (const file of uploadedFiles) {
                    try {
                        let fileContent = '';
                        
                        if (file.type === 'application/pdf') {
                            fileContent = await extractTextFromPDF(file);
                        } else if (file.type.startsWith('text/') || file.name.endsWith('.txt') || file.name.endsWith('.md')) {
                            fileContent = await file.text();
                        } else {
                            throw new Error('Unsupported file type. Please upload PDF or text files.');
                        }
                        
                        newFiles.push({
                            name: file.name,
                            type: file.type,
                            content: fileContent,
                            size: file.size
                        });
                        
                        combinedContent += '\n\n--- ' + file.name + ' ---\n\n' + fileContent;
                        
                    } catch (error) {
                        newFiles.push({
                            name: file.name,
                            type: file.type,
                            content: `Error reading ${file.name}: ${error.message}`,
                            size: file.size,
                            error: true
                        });
                    }
                }
                
                setFiles(prev => [...prev, ...newFiles]);
                setContent(combinedContent);
                setLoading(false);
            };
            
            // Remove file
            const removeFile = (index) => {
                const removedFile = files[index];
                const newFiles = files.filter((_, i) => i !== index);
                
                // Remove file content from combined content
                const fileMarker = `--- ${removedFile.name} ---`;
                const contentParts = content.split(fileMarker);
                if (contentParts.length > 1) {
                    // Remove the file's content section
                    const beforeFile = contentParts[0];
                    const afterFileEnd = contentParts[1].split('--- ').slice(1).join('--- ');
                    setContent(beforeFile + (afterFileEnd ? '--- ' + afterFileEnd : ''));
                }
                
                setFiles(newFiles);
            };
            
            // Generate quiz
            const generateQuiz = () => {
                if (!content.trim() && files.length === 0) {
                    alert('Please add content or upload files first!');
                    return;
                }
                
                setLoading(true);
                
                setTimeout(() => {
                    const generatedQuestions = generateQuestionsFromContent(content);
                    setQuestions(generatedQuestions);
                    generateSummary(content);
                    generateFlashcards(content);
                    setActiveTab('content');
                    setLoading(false);
                }, 2000);
            };
            
            // Enhanced question generation
            const generateQuestionsFromContent = (text) => {
                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 20);
                const words = text.split(/\s+/).filter(w => w.length > 4);
                const questions = [];
                let questionId = 1;
                
                Object.entries(difficultyDistribution).forEach(([difficulty, count]) => {
                    Object.entries(questionTypes).forEach(([type, totalCount]) => {
                        const questionsForDifficulty = Math.ceil((count / Object.values(difficultyDistribution).reduce((a, b) => a + b)) * totalCount);
                        
                        for (let i = 0; i < questionsForDifficulty && questionId <= 20; i++) {
                            const randomSentence = sentences[Math.floor(Math.random() * sentences.length)] || 'Sample content';
                            const keyWord = words[Math.floor(Math.random() * words.length)] || 'concept';
                            
                            let question = {};
                            
                            if (type === 'mcq') {
                                question = {
                                    id: questionId++,
                                    type: 'mcq',
                                    question: generateMCQQuestion(keyWord, difficulty),
                                    options: generateMCQOptions(keyWord, difficulty),
                                    correct: 'A',
                                    difficulty: difficulty,
                                    explanation: `This relates to "${keyWord}" in the provided content.`
                                };
                            } else if (type === 'truefalse') {
                                const isTrue = Math.random() > 0.5;
                                question = {
                                    id: questionId++,
                                    type: 'truefalse',
                                    question: `The content discusses "${keyWord}" as a fundamental concept.`,
                                    options: ['True', 'False'],
                                    correct: isTrue ? 'True' : 'False',
                                    difficulty: difficulty,
                                    explanation: `Based on the analysis of "${keyWord}" in the content.`
                                };
                            } else if (type === 'short') {
                                question = {
                                    id: questionId++,
                                    type: 'short',
                                    question: generateShortQuestion(keyWord, difficulty),
                                    difficulty: difficulty,
                                    explanation: `A comprehensive answer should analyze "${keyWord}" with examples.`,
                                    sampleAnswer: `${keyWord} is a key concept that plays an important role in understanding the subject matter. It connects to other ideas and provides foundational knowledge for further learning.`
                                };
                            }
                            
                            questions.push(question);
                        }
                    });
                });
                
                return questions.slice(0, 15);
            };
            
            const generateMCQQuestion = (keyWord, difficulty) => {
                const questions = {
                    easy: `What is "${keyWord}" in the context of this content?`,
                    medium: `How does "${keyWord}" relate to the main concepts?`,
                    hard: `Analyze the significance of "${keyWord}" in the material.`,
                    expert: `Evaluate the implications of "${keyWord}" beyond the given context.`
                };
                return questions[difficulty];
            };
            
            const generateMCQOptions = (keyWord, difficulty) => {
                return [
                    `A key concept related to ${keyWord}`,
                    `A supporting detail about ${keyWord}`,
                    `An example of ${keyWord}`,
                    `An unrelated term to ${keyWord}`
                ];
            };
            
            const generateShortQuestion = (keyWord, difficulty) => {
                const questions = {
                    easy: `Describe "${keyWord}" based on the content.`,
                    medium: `Explain how "${keyWord}" connects to other concepts.`,
                    hard: `Analyze the role of "${keyWord}" in the material.`,
                    expert: `Critically evaluate "${keyWord}" and its applications.`
                };
                return questions[difficulty];
            };
            
            // Generate summary
            const generateSummary = (text) => {
                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 15);
                const keySentences = sentences.slice(0, 5);
                const wordCount = text.split(/\s+/).length;
                
                const summaryText = `## Content Overview\n\nThis material contains comprehensive information suitable for learning and assessment. The content has been processed from ${files.length} files with approximately ${wordCount} words.\n\n## Key Points\n\n${keySentences.map((s, i) => `${i + 1}. ${s.trim().substring(0, 100)}...`).join('\n')}\n\n## Analysis\n\nThe content has been analyzed to generate ${Object.values(difficultyDistribution).reduce((a, b) => a + b)} questions across multiple difficulty levels and ${flashcards.length} flashcards for comprehensive learning.`;
                
                setSummary(summaryText);
            };
            
            // Generate flashcards with enhanced content
            const generateFlashcards = (text) => {
                const words = text.split(/\s+/).filter(w => w.length > 5 && /^[A-Za-z]+$/.test(w));
                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 20);
                const uniqueWords = [...new Set(words)].slice(0, 15);
                
                const cards = uniqueWords.map((word, index) => {
                    const relevantSentence = sentences.find(s => 
                        s.toLowerCase().includes(word.toLowerCase())
                    ) || sentences[index % sentences.length] || 'Related to the study material.';
                    
                    const categories = ['Primary Concept', 'Supporting Detail', 'Technical Term', 'Key Process', 'Important Factor'];
                    const colors = ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
                    
                    return {
                        id: index + 1,
                        front: word.charAt(0).toUpperCase() + word.slice(1),
                        back: `**Definition:** Key concept from the material\n\n**Context:** "${relevantSentence.trim().substring(0, 120)}..."\n\n**Importance:** Essential term for understanding the subject matter.\n\n**Usage:** Appears frequently in the provided content and relates to core learning objectives.`,
                        category: categories[index % categories.length],
                        color: colors[index % colors.length]
                    };
                });
                
                setFlashcards(cards);
            };
            
            // Quiz functions
            const startQuiz = () => {
                if (questions.length === 0) {
                    alert('Please generate questions first!');
                    return;
                }
                setQuizMode(true);
                setCurrentQuestion(0);
                setAnswers({});
                setScore(0);
                setShowResults(false);
                setShowAnswers(false);
                setActiveTab('quiz');
            };
            
            const selectAnswer = (answer) => {
                setAnswers(prev => ({
                    ...prev,
                    [questions[currentQuestion].id]: answer
                }));
            };
            
            const nextQuestion = () => {
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(prev => prev + 1);
                } else {
                    finishQuiz();
                }
            };
            
            const prevQuestion = () => {
                if (currentQuestion > 0) {
                    setCurrentQuestion(prev => prev - 1);
                }
            };
            
            const finishQuiz = () => {
                let finalScore = 0;
                questions.forEach(q => {
                    const userAnswer = answers[q.id];
                    if (q.type === 'short') {
                        if (userAnswer && userAnswer.length > 10) finalScore++;
                    } else {
                        if (userAnswer === q.correct) finalScore++;
                    }
                });
                setScore(finalScore);
                setShowResults(true);
                setActiveTab('results');
            };
            
            const restartQuiz = () => {
                setCurrentQuestion(0);
                setAnswers({});
                setScore(0);
                setShowResults(false);
                setShowAnswers(false);
                setQuizMode(true);
                setActiveTab('quiz');
            };
            
            // Fixed flashcard flip function
            const flipCard = (cardId) => {
                setFlippedCards(prev => {
                    const newSet = new Set(prev);
                    if (newSet.has(cardId)) {
                        newSet.delete(cardId);
                    } else {
                        newSet.add(cardId);
                    }
                    return newSet;
                });
            };
            
            // Drag and drop handlers
            const handleDrop = (e) => {
                e.preventDefault();
                e.currentTarget.classList.remove('drag-over');
                const droppedFiles = Array.from(e.dataTransfer.files);
                handleFileUpload(droppedFiles);
            };
            
            const handleDragOver = (e) => {
                e.preventDefault();
                e.currentTarget.classList.add('drag-over');
            };
            
            const handleDragLeave = (e) => {
                e.preventDefault();
                e.currentTarget.classList.remove('drag-over');
            };
            
            const updateDifficultyCount = (difficulty, count) => {
                setDifficultyDistribution(prev => ({
                    ...prev,
                    [difficulty]: Math.max(0, Math.min(10, count))
                }));
            };
            
            const updateQuestionType = (type, count) => {
                setQuestionTypes(prev => ({
                    ...prev,
                    [type]: Math.max(0, Math.min(20, count))
                }));
            };
            
            const formatFileSize = (bytes) => {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            };
            
            const currentQ = questions[currentQuestion];
            const progress = questions.length > 0 ? ((currentQuestion + 1) / questions.length) * 100 : 0;
            
            return (
                <div className="container">
                    {/* Loading Overlay */}
                    {loading && (
                        <div className="loading-overlay">
                            <div className="loading-spinner"></div>
                            <p>Processing your content...</p>
                        </div>
                    )}
                    
                    {/* Header */}
                    <div className="header">
                        <h1>QuizGen Pro</h1>
                        <p>AI-Powered Learning Assistant with Dynamic Difficulty</p>
                    </div>
                    
                    {/* Navigation */}
                    <div className="glass-card" style={{ padding: '8px', marginBottom: '32px' }}>
                        <div className="tab-nav">
                            <button 
                                className={`tab-btn ${activeTab === 'upload' ? 'active' : ''}`}
                                onClick={() => setActiveTab('upload')}
                            >
                                📄 Upload & Configure
                            </button>
                            <button 
                                className={`tab-btn ${activeTab === 'content' ? 'active' : ''}`}
                                onClick={() => setActiveTab('content')}
                                disabled={!summary}
                            >
                                📚 Content & Flashcards
                            </button>
                            <button 
                                className={`tab-btn ${activeTab === 'quiz' ? 'active' : ''}`}
                                onClick={() => setActiveTab('quiz')}
                                disabled={questions.length === 0 && !quizMode}
                            >
                                🎯 Interactive Quiz
                            </button>
                            {showResults && (
                                <button 
                                    className={`tab-btn ${activeTab === 'results' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('results')}
                                >
                                    📊 Results
                                </button>
                            )}
                        </div>
                    </div>
                    
                    {/* Upload Tab */}
                    {activeTab === 'upload' && (
                        <div className="grid-2">
                            <div className="glass-card" style={{ padding: '32px' }}>
                                <h2 style={{ marginBottom: '24px' }}>📝 Add Content</h2>
                                
                                <div className="form-group">
                                    <label className="form-label">Direct Text Input</label>
                                    <textarea
                                        className="textarea-field"
                                        placeholder="Paste your study material here..."
                                        value={content}
                                        onChange={(e) => setContent(e.target.value)}
                                        rows="6"
                                    />
                                </div>
                                
                                <div className="form-group">
                                    <label className="form-label">Upload Files (PDF, TXT, MD)</label>
                                    <div 
                                        className="upload-area"
                                        onClick={() => fileInputRef.current?.click()}
                                        onDrop={handleDrop}
                                        onDragOver={handleDragOver}
                                        onDragLeave={handleDragLeave}
                                    >
                                        <div style={{ fontSize: '48px', marginBottom: '16px' }}>📁</div>
                                        <p style={{ fontSize: '1.1rem', marginBottom: '8px' }}>Drop files here or click to browse</p>
                                        <p style={{ color: 'rgba(255, 255, 255, 0.6)' }}>Supports PDF, TXT, and MD files</p>
                                    </div>
                                    <input
                                        ref={fileInputRef}
                                        type="file"
                                        multiple
                                        accept=".pdf,.txt,.md"
                                        style={{ display: 'none' }}
                                        onChange={(e) => handleFileUpload(Array.from(e.target.files))}
                                    />
                                </div>
                                
                                {files.length > 0 && (
                                    <div className="file-list">
                                        <h3 style={{ marginBottom: '16px' }}>📋 Uploaded Files</h3>
                                        {files.map((file, index) => (
                                            <div key={index} className="file-item">
                                                <div className="file-info">
                                                    <div className="file-name">{file.name}</div>
                                                    <div className="file-size">{formatFileSize(file.size)}</div>
                                                </div>
                                                <button 
                                                    className="remove-btn"
                                                    onClick={() => removeFile(index)}
                                                >
                                                    Remove
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                <button 
                                    className="btn-primary" 
                                    onClick={generateQuiz}
                                    style={{ width: '100%', marginTop: '24px' }}
                                    disabled={!content.trim() && files.length === 0}
                                >
                                    🚀 Generate Learning Materials
                                </button>
                            </div>
                            
                            <div className="glass-card" style={{ padding: '32px' }}>
                                <h2 style={{ marginBottom: '24px' }}>⚙️ Configuration</h2>
                                
                                <div className="form-group">
                                    <label className="form-label">Difficulty Distribution</label>
                                    <div className="grid-4">
                                        {Object.entries(difficultyDistribution).map(([difficulty, count]) => (
                                            <div key={difficulty} className="difficulty-selector">
                                                <div style={{ fontSize: '0.9rem', marginBottom: '8px', textTransform: 'capitalize' }}>
                                                    {difficulty}
                                                </div>
                                                <input
                                                    type="number"
                                                    className="difficulty-input"
                                                    value={count}
                                                    min="0"
                                                    max="10"
                                                    onChange={(e) => updateDifficultyCount(difficulty, parseInt(e.target.value) || 0)}
                                                />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                
                                <div className="form-group">
                                    <label className="form-label">Question Types</label>
                                    <div className="grid-3">
                                        <div className="difficulty-selector">
                                            <div style={{ fontSize: '0.9rem', marginBottom: '8px' }}>Multiple Choice</div>
                                            <input
                                                type="number"
                                                className="difficulty-input"
                                                value={questionTypes.mcq}
                                                min="0"
                                                max="20"
                                                onChange={(e) => updateQuestionType('mcq', parseInt(e.target.value) || 0)}
                                            />
                                        </div>
                                        <div className="difficulty-selector">
                                            <div style={{ fontSize: '0.9rem', marginBottom: '8px' }}>True/False</div>
                                            <input
                                                type="number"
                                                className="difficulty-input"
                                                value={questionTypes.truefalse}
                                                min="0"
                                                max="20"
                                                onChange={(e) => updateQuestionType('truefalse', parseInt(e.target.value) || 0)}
                                            />
                                        </div>
                                        <div className="difficulty-selector">
                                            <div style={{ fontSize: '0.9rem', marginBottom: '8px' }}>Short Answer</div>
                                            <input
                                                type="number"
                                                className="difficulty-input"
                                                value={questionTypes.short}
                                                min="0"
                                                max="20"
                                                onChange={(e) => updateQuestionType('short', parseInt(e.target.value) || 0)}
                                            />
                                        </div>
                                    </div>
                                </div>
                                
                                <div style={{ background: 'rgba(79, 70, 229, 0.1)', border: '1px solid rgba(79, 70, 229, 0.2)', borderRadius: '12px', padding: '16px', marginTop: '20px' }}>
                                    <h4 style={{ marginBottom: '8px' }}>📈 Generation Summary</h4>
                                    <p style={{ fontSize: '0.9rem', color: 'rgba(255, 255, 255, 0.8)' }}>
                                        Total Questions: {Object.values(difficultyDistribution).reduce((a, b) => a + b)} | 
                                        Total Types: {Object.values(questionTypes).reduce((a, b) => a + b)}
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Content Tab */}
                    {activeTab === 'content' && (
                        <div>
                            <div className="glass-card" style={{ padding: '32px', marginBottom: '32px' }}>
                                <h2 style={{ marginBottom: '24px' }}>📖 Content Summary</h2>
                                <div style={{ whiteSpace: 'pre-line', lineHeight: '1.6' }}>
                                    {summary.split('\n').map((line, i) => {
                                        if (line.startsWith('##')) {
                                            return <h3 key={i} style={{ margin: '20px 0 12px 0', color: '#4f46e5' }}>{line.replace('##', '')}</h3>;
                                        }
                                        return <p key={i} style={{ marginBottom: '8px' }}>{line}</p>;
                                    })}
                                </div>
                                <div style={{ marginTop: '24px', display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
                                    <button className="btn-primary" onClick={startQuiz}>
                                        🎯 Start Quiz
                                    </button>
                                    <button className="btn-secondary" onClick={() => setActiveTab('upload')}>
                                        ← Back to Upload
                                    </button>
                                </div>
                            </div>
                            
                            <div className="glass-card" style={{ padding: '32px' }}>
                                <h2 style={{ marginBottom: '24px' }}>🃏 Study Flashcards</h2>
                                <p style={{ marginBottom: '24px', color: 'rgba(255, 255, 255, 0.7)' }}>
                                    Click on any card to flip and see the detailed explanation
                                </p>
                                
                                <div className="grid-3">
                                    {flashcards.map(card => (
                                        <div
                                            key={card.id}
                                            className={`flashcard ${flippedCards.has(card.id) ? 'flipped' : ''}`}
                                            onClick={() => flipCard(card.id)}
                                        >
                                            <div className="flashcard-front">
                                                <div className="flashcard-category" style={{ background: card.color }}>
                                                    {card.category}
                                                </div>
                                                <h3 style={{ fontSize: '1.5rem', textAlign: 'center' }}>
                                                    {card.front}
                                                </h3>
                                                <p style={{ fontSize: '0.9rem', opacity: '0.7', marginTop: '16px' }}>
                                                    Click to reveal details
                                                </p>
                                            </div>
                                            <div className="flashcard-back">
                                                <div style={{ fontSize: '0.9rem', lineHeight: '1.5' }}>
                                                    {card.back.split('\n\n').map((section, i) => (
                                                        <div key={i} style={{ marginBottom: '12px' }}>
                                                            {section.startsWith('**') ? 
                                                                <><strong>{section.split('**')[1]}:</strong> {section.split('**')[2]}</> : 
                                                                section
                                                            }
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Quiz Tab */}
                    {activeTab === 'quiz' && quizMode && !showResults && (
                        <div className="glass-card" style={{ padding: '32px' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
                                <h2>🎯 Interactive Quiz</h2>
                                <div style={{ fontSize: '0.9rem', color: 'rgba(255, 255, 255, 0.7)' }}>
                                    Question {currentQuestion + 1} of {questions.length}
                                </div>
                            </div>
                            
                            <div className="progress-bar">
                                <div className="progress-fill" style={{ width: `${progress}%` }}></div>
                            </div>
                            
                            {currentQ && (
                                <div className="quiz-question">
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '16px' }}>
                                        <span style={{ 
                                            background: currentQ.difficulty === 'easy' ? '#10b981' : 
                                                      currentQ.difficulty === 'medium' ? '#f59e0b' : 
                                                      currentQ.difficulty === 'hard' ? '#ef4444' : '#8b5cf6',
                                            color: 'white',
                                            padding: '4px 12px',
                                            borderRadius: '20px',
                                            fontSize: '0.8rem',
                                            fontWeight: '600',
                                            textTransform: 'capitalize'
                                        }}>
                                            {currentQ.difficulty}
                                        </span>
                                        <span style={{ 
                                            background: 'rgba(255, 255, 255, 0.1)',
                                            color: 'white',
                                            padding: '4px 12px',
                                            borderRadius: '20px',
                                            fontSize: '0.8rem',
                                            fontWeight: '600',
                                            textTransform: 'uppercase'
                                        }}>
                                            {currentQ.type === 'mcq' ? 'Multiple Choice' : 
                                             currentQ.type === 'truefalse' ? 'True/False' : 'Short Answer'}
                                        </span>
                                    </div>
                                    
                                    <h3 style={{ fontSize: '1.3rem', marginBottom: '24px', lineHeight: '1.4' }}>
                                        {currentQ.question}
                                    </h3>
                                    
                                    {currentQ.type === 'short' ? (
                                        <textarea
                                            className="textarea-field"
                                            placeholder="Type your answer here..."
                                            value={answers[currentQ.id] || ''}
                                            onChange={(e) => selectAnswer(e.target.value)}
                                            rows="4"
                                        />
                                    ) : (
                                        <div>
                                            {currentQ.options.map((option, index) => (
                                                <div
                                                    key={index}
                                                    className={`option ${answers[currentQ.id] === option ? 'selected' : ''}`}
                                                    onClick={() => selectAnswer(option)}
                                                >
                                                    <span style={{ marginRight: '12px', fontWeight: '600' }}>
                                                        {currentQ.type === 'truefalse' ? (option === 'True' ? '✓' : '✗') : String.fromCharCode(65 + index)}
                                                    </span>
                                                    {option}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    
                                    <div style={{ marginTop: '32px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                        <button 
                                            className="btn-secondary"
                                            onClick={prevQuestion}
                                            disabled={currentQuestion === 0}
                                        >
                                            ← Previous
                                        </button>
                                        
                                        <div style={{ display: 'flex', gap: '12px' }}>
                                            {currentQuestion === questions.length - 1 ? (
                                                <button 
                                                    className="btn-primary"
                                                    onClick={finishQuiz}
                                                    disabled={!answers[currentQ.id]}
                                                >
                                                    🏁 Finish Quiz
                                                </button>
                                            ) : (
                                                <button 
                                                    className="btn-primary"
                                                    onClick={nextQuestion}
                                                    disabled={!answers[currentQ.id]}
                                                >
                                                    Next →
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                    
                    {/* Results Tab */}
                    {activeTab === 'results' && showResults && (
                        <div>
                            <div className="glass-card" style={{ padding: '32px', marginBottom: '32px' }}>
                                <h2 style={{ textAlign: 'center', marginBottom: '32px' }}>🏆 Quiz Results</h2>
                                
                                <div className="stats-grid">
                                    <div className="stat-card">
                                        <div className="stat-value" style={{ color: '#10b981' }}>{score}</div>
                                        <div className="stat-label">Correct Answers</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-value" style={{ color: '#ef4444' }}>{questions.length - score}</div>
                                        <div className="stat-label">Incorrect Answers</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-value" style={{ color: '#4f46e5' }}>
                                            {Math.round((score / questions.length) * 100)}%
                                        </div>
                                        <div className="stat-label">Overall Score</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-value" style={{ color: '#f59e0b' }}>{questions.length}</div>
                                        <div className="stat-label">Total Questions</div>
                                    </div>
                                </div>
                                
                                <div style={{ textAlign: 'center', marginTop: '32px' }}>
                                    <h3 style={{ marginBottom: '16px' }}>
                                        {score / questions.length >= 0.8 ? '🌟 Excellent Work!' :
                                         score / questions.length >= 0.6 ? '👍 Good Job!' :
                                         score / questions.length >= 0.4 ? '📚 Keep Learning!' : '💪 Keep Practicing!'}
                                    </h3>
                                    <p style={{ color: 'rgba(255, 255, 255, 0.7)', marginBottom: '24px' }}>
                                        {score / questions.length >= 0.8 ? 'Outstanding performance! You have mastered this material.' :
                                         score / questions.length >= 0.6 ? 'Good understanding! Review the missed questions to improve.' :
                                         score / questions.length >= 0.4 ? 'Fair performance. More study time would be beneficial.' : 'Consider reviewing the material thoroughly before retaking.'}
                                    </p>
                                </div>
                                
                                <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', flexWrap: 'wrap' }}>
                                    <button className="btn-primary" onClick={restartQuiz}>
                                        🔄 Retake Quiz
                                    </button>
                                    <button className="btn-secondary" onClick={() => setShowAnswers(!showAnswers)}>
                                        {showAnswers ? '👁️ Hide' : '👁️ Show'} Answers
                                    </button>
                                    <button className="btn-secondary" onClick={() => setActiveTab('content')}>
                                        📚 Study More
                                    </button>
                                </div>
                            </div>
                            
                            {showAnswers && (
                                <div className="glass-card" style={{ padding: '32px' }}>
                                    <h2 style={{ marginBottom: '24px' }}>📋 Answer Review</h2>
                                    
                                    {questions.map((q, index) => {
                                        const userAnswer = answers[q.id];
                                        const isCorrect = q.type === 'short' ? 
                                            userAnswer && userAnswer.length > 10 : 
                                            userAnswer === q.correct;
                                        
                                        return (
                                            <div key={q.id} style={{ 
                                                background: isCorrect ? 'rgba(16, 185, 129, 0.1)' : 'rgba(239, 68, 68, 0.1)',
                                                border: `1px solid ${isCorrect ? 'rgba(16, 185, 129, 0.3)' : 'rgba(239, 68, 68, 0.3)'}`,
                                                borderRadius: '12px',
                                                padding: '20px',
                                                marginBottom: '16px'
                                            }}>
                                                <div style={{ display: 'flex', alignItems: 'center', marginBottom: '12px' }}>
                                                    <span style={{ 
                                                        background: isCorrect ? '#10b981' : '#ef4444',
                                                        color: 'white',
                                                        padding: '4px 8px',
                                                        borderRadius: '50%',
                                                        marginRight: '12px',
                                                        minWidth: '24px',
                                                        textAlign: 'center',
                                                        fontSize: '0.8rem'
                                                    }}>
                                                        {index + 1}
                                                    </span>
                                                    <span style={{ fontSize: '1.1rem', fontWeight: '600' }}>
                                                        {isCorrect ? '✅ Correct' : '❌ Incorrect'}
                                                    </span>
                                                </div>
                                                
                                                <h4 style={{ marginBottom: '12px' }}>{q.question}</h4>
                                                
                                                <div style={{ marginBottom: '12px' }}>
                                                    <strong>Your Answer: </strong>
                                                    <span style={{ color: isCorrect ? '#10b981' : '#ef4444' }}>
                                                        {userAnswer || 'No answer provided'}
                                                    </span>
                                                </div>
                                                
                                                {q.type !== 'short' && (
                                                    <div style={{ marginBottom: '12px' }}>
                                                        <strong>Correct Answer: </strong>
                                                        <span style={{ color: '#10b981' }}>{q.correct}</span>
                                                    </div>
                                                )}
                                                
                                                {q.sampleAnswer && q.type === 'short' && (
                                                    <div style={{ marginBottom: '12px' }}>
                                                        <strong>Sample Answer: </strong>
                                                        <span style={{ color: 'rgba(255, 255, 255, 0.8)' }}>{q.sampleAnswer}</span>
                                                    </div>
                                                )}
                                                
                                                <div style={{ fontSize: '0.9rem', color: 'rgba(255, 255, 255, 0.7)' }}>
                                                    <strong>Explanation: </strong>{q.explanation}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };
        
        ReactDOM.render(<QuizGenPro />, document.getElementById('root'));
    </script>
</body>
</html>
