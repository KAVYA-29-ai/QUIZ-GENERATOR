<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizGen Pro - AI Quiz Generator</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/pdf-parse@1.1.1/lib/pdf-parse.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .glass:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }
        
        .btn {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .input-group {
            margin-bottom: 24px;
        }
        
        .input-group label {
            display: block;
            color: white;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .input-group input::placeholder,
        .input-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }
        
        .header h1 {
            font-size: 3.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ffffff, #f0f9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.3);
        }
        
        .header p {
            font-size: 1.3rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        
        .tab-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .tab-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .tab-btn.active {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }
        
        .file-upload {
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .file-upload:hover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }
        
        .file-upload.drag-over {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            transform: scale(1.02);
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .quiz-settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .setting-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .flashcard {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            margin: 20px 0;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            transform-style: preserve-3d;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .flashcard:hover {
            transform: translateY(-5px) rotateY(5deg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        
        .flashcard-content {
            text-align: center;
            color: white;
            backface-visibility: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .flashcard-back {
            transform: rotateY(180deg);
        }
        
        .quiz-question {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            margin: 20px 0;
            position: relative;
            animation: slideIn 0.6s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .options-grid {
            display: grid;
            gap: 15px;
            margin: 25px 0;
        }
        
        .option {
            padding: 18px 24px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }
        
        .option:hover::before {
            left: 100%;
        }
        
        .option:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(8px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        
        .option.selected {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.2);
            transform: scale(1.02);
        }
        
        .option.correct {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.2);
            animation: correctPulse 0.6s ease;
        }
        
        .option.incorrect {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
            animation: shake 0.5s ease;
        }
        
        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width 0.3s ease;
            border-radius: 5px;
            position: relative;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            color: white;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ffffff, #f0f9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        
        .floating-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        .success-animation {
            animation: successBounce 0.8s ease;
        }
        
        @keyframes successBounce {
            0% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(0.95); }
            75% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        
        .modal-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: modalSlideIn 0.4s ease;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .focus-points {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid #ef4444;
            padding: 20px;
            border-radius: 0 12px 12px 0;
            margin: 20px 0;
        }
        
        .focus-points h3 {
            color: #fca5a5;
            margin-bottom: 15px;
        }
        
        @media (max-width: 768px) {
            .container { padding: 10px; }
            .header h1 { font-size: 2.5rem; }
            .quiz-settings { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .tab-nav { justify-content: center; }
            .modal-content { padding: 20px; margin: 10px; }
        }
    </style>
</head>
<body>
    <div class="floating-particles">
        <div class="particle" style="width: 60px; height: 60px; top: 10%; left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="width: 80px; height: 80px; top: 60%; right: 10%; animation-delay: 2s;"></div>
        <div class="particle" style="width: 40px; height: 40px; top: 80%; left: 30%; animation-delay: 4s;"></div>
        <div class="particle" style="width: 100px; height: 100px; top: 20%; right: 30%; animation-delay: 1s;"></div>
    </div>
    
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const QuizGenPro = () => {
            const [activeTab, setActiveTab] = useState('upload');
            const [content, setContent] = useState('');
            const [files, setFiles] = useState([]);
            const [loading, setLoading] = useState(false);
            
            // Quiz Settings
            const [mcqCount, setMcqCount] = useState(5);
            const [shortCount, setShortCount] = useState(3);
            const [tfCount, setTfCount] = useState(2);
            const [difficulty, setDifficulty] = useState('medium');
            
            // Quiz State
            const [questions, setQuestions] = useState([]);
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [answers, setAnswers] = useState({});
            const [score, setScore] = useState(0);
            const [showResults, setShowResults] = useState(false);
            const [quizMode, setQuizMode] = useState(false);
            const [showFocusPoints, setShowFocusPoints] = useState(false);
            const [focusPoints, setFocusPoints] = useState([]);
            
            // Content State
            const [summary, setSummary] = useState('');
            const [flashcards, setFlashcards] = useState([]);
            const [flippedCards, setFlippedCards] = useState(new Set());
            
            const fileInputRef = useRef(null);
            
            // Enhanced PDF text extraction
            const extractTextFromPDF = async (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const arrayBuffer = e.target.result;
                            const uint8Array = new Uint8Array(arrayBuffer);
                            
                            // Simple PDF text extraction
                            let text = '';
                            const decoder = new TextDecoder('utf-8');
                            const pdfText = decoder.decode(uint8Array);
                            
                            // Extract text between stream objects
                            const streamRegex = /stream\s*(.*?)\s*endstream/gs;
                            const matches = pdfText.match(streamRegex);
                            
                            if (matches) {
                                matches.forEach(match => {
                                    const streamContent = match.replace(/^stream\s*/, '').replace(/\s*endstream$/, '');
                                    // Basic text extraction - decode common PDF text
                                    const textContent = streamContent.replace(/[^\x20-\x7E]/g, ' ');
                                    text += textContent + ' ';
                                });
                            }
                            
                            // Fallback: extract any readable text
                            if (!text.trim()) {
                                text = pdfText.replace(/[^\x20-\x7E\s]/g, '').replace(/\s+/g, ' ').trim();
                            }
                            
                            resolve(text || 'PDF content extracted');
                        } catch (error) {
                            console.error('PDF extraction error:', error);
                            resolve('Unable to extract PDF text. Please try copying the text manually.');
                        }
                    };
                    reader.readAsArrayBuffer(file);
                });
            };
            
            // File upload handler
            const handleFileUpload = async (uploadedFiles) => {
                setLoading(true);
                const newFiles = [];
                let combinedContent = content;
                
                for (const file of uploadedFiles) {
                    try {
                        let fileContent = '';
                        
                        if (file.type === 'application/pdf') {
                            fileContent = await extractTextFromPDF(file);
                        } else if (file.type === 'text/plain' || file.type === 'text/csv') {
                            fileContent = await file.text();
                        } else {
                            // Try to read as text anyway
                            fileContent = await file.text();
                        }
                        
                        newFiles.push({
                            name: file.name,
                            type: file.type,
                            content: fileContent,
                            size: file.size
                        });
                        
                        combinedContent += '\n\n' + fileContent;
                        
                    } catch (error) {
                        console.error(`Error processing ${file.name}:`, error);
                        newFiles.push({
                            name: file.name,
                            type: file.type,
                            content: `Error reading ${file.name}`,
                            size: file.size,
                            error: true
                        });
                    }
                }
                
                setFiles(prev => [...prev, ...newFiles]);
                setContent(combinedContent);
                setLoading(false);
            };
            
            // Generate quiz with custom settings
            const generateQuiz = () => {
                if (!content.trim()) {
                    alert('Please add content first!');
                    return;
                }
                
                setLoading(true);
                
                // Simulate API call - replace with actual implementation
                setTimeout(() => {
                    const generatedQuestions = generateQuestionsFromContent(content);
                    setQuestions(generatedQuestions);
                    generateSummary(content);
                    generateFlashcards(content);
                    setActiveTab('content');
                    setLoading(false);
                }, 2000);
            };
            
            // Enhanced question generation
            const generateQuestionsFromContent = (text) => {
                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 20);
                const words = text.split(/\s+/).filter(w => w.length > 4);
                const questions = [];
                let questionId = 1;
                
                // Generate MCQs
                for (let i = 0; i < mcqCount; i++) {
                    const randomSentence = sentences[Math.floor(Math.random() * sentences.length)];
                    const keyWord = words[Math.floor(Math.random() * words.length)];
                    
                    questions.push({
                        id: questionId++,
                        type: 'mcq',
                        question: `What is the significance of "${keyWord}" in the context of the content?`,
                        options: [
                            `A) ${keyWord} represents a key concept in the subject matter`,
                            `B) ${keyWord} is merely a supporting detail`,
                            `C) ${keyWord} is unrelated to the main topic`,
                            `D) ${keyWord} is used as an example only`
                        ],
                        correct: 'A',
                        difficulty: difficulty,
                        explanation: `${keyWord} appears in the context: "${randomSentence.slice(0, 100)}..."`
                    });
                }
                
                // Generate True/False
                for (let i = 0; i < tfCount; i++) {
                    const randomSentence = sentences[Math.floor(Math.random() * sentences.length)];
                    const keyWord = words[Math.floor(Math.random() * words.length)];
                    
                    questions.push({
                        id: questionId++,
                        type: 'truefalse',
                        question: `The content discusses "${keyWord}" as a central theme.`,
                        options: ['True', 'False'],
                        correct: text.toLowerCase().includes(keyWord.toLowerCase()) ? 'True' : 'False',
                        difficulty: difficulty,
                        explanation: `This is based on the presence of "${keyWord}" in the content.`
                    });
                }
                
                // Generate Short Answer
                for (let i = 0; i < shortCount; i++) {
                    const keyWord = words[Math.floor(Math.random() * words.length)];
                    
                    questions.push({
                        id: questionId++,
                        type: 'short',
                        question: `Explain the role and importance of "${keyWord}" based on the provided content.`,
                        difficulty: difficulty,
                        explanation: `A good answer should reference the context in which "${keyWord}" appears and its relevance to the main topic.`
                    });
                }
                
                return questions.sort(() => Math.random() - 0.5); // Shuffle questions
            };
            
            // Generate summary
            const generateSummary = (text) => {
                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 10);
                const keySentences = sentences.slice(0, 5);
                setSummary(`This content covers: ${keySentences.join('. ')}.`);
            };
            
            // Generate flashcards
            const generateFlashcards = (text) => {
                const words = text.split(/\s+/).filter(w => w.length > 6);
                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 20);
                
                const cards = words.slice(0, 8).map((word, index) => ({
                    id: index + 1,
                    front: word,
                    back: `Definition or context of "${word}" from the content: ${sentences[index % sentences.length].slice(0, 100)}...`
                }));
                
                setFlashcards(cards);
            };
            
            // Quiz functions
            const startQuiz = () => {
                setQuizMode(true);
                setCurrentQuestion(0);
                setAnswers({});
                setScore(0);
                setShowResults(false);
                setActiveTab('quiz');
            };
            
            const selectAnswer = (answer) => {
                setAnswers(prev => ({
                    ...prev,
                    [questions[currentQuestion].id]: answer
                }));
            };
            
            const nextQuestion = () => {
                const current = questions[currentQuestion];
                const userAnswer = answers[current.id];
                const isCorrect = userAnswer === current.correct;
                
                if (isCorrect) {
                    setScore(prev => prev + 1);
                }
                
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(prev => prev + 1);
                } else {
                    finishQuiz();
                }
            };
            
            const finishQuiz = () => {
                setShowResults(true);
                const wrongAnswers = questions.filter(q => answers[q.id] !== q.correct);
                if (wrongAnswers.length > 0) {
                    setFocusPoints(wrongAnswers.map(q => ({
                        question: q.question,
                        yourAnswer: answers[q.id],
                        correctAnswer: q.correct,
                        explanation: q.explanation
                    })));
                    setShowFocusPoints(true);
                }
            };
            
            const flipCard = (cardId) => {
                setFlippedCards(prev => {
                    const newSet = new Set(prev);
                    if (newSet.has(cardId)) {
                        newSet.delete(cardId);
                    } else {
                        newSet.add(cardId);
                    }
                    return newSet;
                });
            };
            
            // Drag and drop handlers
            const handleDrop = (e) => {
                e.preventDefault();
                const droppedFiles = Array.from(e.dataTransfer.files);
                handleFileUpload(droppedFiles);
            };
            
            const handleDragOver = (e) => {
                e.preventDefault();
            };
            
            return (
                <div className="container">
                    <div className="header">
                        <h1>QuizGen Pro</h1>
                        <p>Advanced AI-Powered Learning Assistant</p>
                    </div>
                    
                    {/* Navigation */}
                    <div className="glass" style={{ padding: '20px', marginBottom: '30px' }}>
                        <div className="tab-nav">
                            <button 
                                className={`tab-btn ${activeTab === 'upload' ? 'active' : ''}`}
                                onClick={() => setActiveTab('upload')}
                            >
                                📁 Upload & Settings
                            </button>
                            <button 
                                className={`tab-btn ${activeTab === 'content' ? 'active' : ''}`}
                                onClick={() => setActiveTab('content')}
                                disabled={!summary}
                            >
                                📄 Content & Flashcards
                            </button>
                            <button 
                                className={`tab-btn ${activeTab === 'quiz' ? 'active' : ''}`}
                                onClick={() => setActiveTab('quiz')}
                                disabled={questions.length === 0}
                            >
                                🎯 Quiz
                            </button>
                            {showResults && (
                                <button 
                                    className={`tab-btn ${activeTab === 'results' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('results')}
                                >
                                    🏆 Results
                                </button>
                            )}
                        </div>
                    </div>
                    
                    {/* Upload & Settings Tab */}
                    {activeTab === 'upload' && (
                        <div className="glass" style={{ padding: '40px' }}>
                            <h2 style={{ color: 'white', marginBottom: '30px', fontSize: '2rem' }}>Upload Content & Configure Quiz</h2>
                            
                            {/* File Upload */}
                            <div 
                                className="file-upload"
                                onDrop={handleDrop}
                                onDragOver={handleDragOver}
                                onClick={() => fileInputRef.current?.click()}
                            >
                                <div style={{ fontSize: '3rem', marginBottom: '15px' }}>📁</div>
                                <h3>Drop files here or click to browse</h3>
                                <p style={{ opacity: 0.7, marginTop: '10px' }}>
                                    Supports: PDF, TXT, CSV files
                                </p>
                            </div>
                            
                            <input
                                ref={fileInputRef}
                                type="file"
                                multiple
                                accept=".pdf,.txt,.csv"
                                style={{ display: 'none' }}
                                onChange={(e) => handleFileUpload(Array.from(e.target.files))}
                            />
                            
                            {/* Uploaded Files */}
                            {files.length > 0 && (
                                <div style={{ margin: '30px 0' }}>
                                    <h3 style={{ color: 'white', marginBottom: '15px' }}>Uploaded Files:</h3>
                                    <div style={{ display: 'grid', gap: '10px' }}>
                                        {files.map((file, index) => (
                                            <div key={index} className="glass" style={{ 
                                                padding: '15px', 
                                                display: 'flex', 
                                                justifyContent: 'space-between',
                                                alignItems: 'center',
                                                background: file.error ? 'rgba(239, 68, 68, 0.1)' : 'rgba(16, 185, 129, 0.1)'
                                            }}>
                                                <div>
                                                    <strong style={{ color: 'white' }}>{file.name}</strong>
                                                    <p style={{ color: 'rgba(255,255,255,0.7)', fontSize: '14px' }}>
                                                        {file.type} • {(file.size / 1024).toFixed(1)} KB
                                                    </p>
                                                </div>
                                                <div style={{ 
                                                    padding: '8px 16px', 
                                                    borderRadius: '20px',
                                                    background: file.error ? 'rgba(239, 68, 68, 0.2)' : 'rgba(16, 185, 129, 0.2)',
                                                    color: 'white',
                                                    fontSize: '14px'
                                                }}>
                                                    {file.error ? '⚠️ Error' : '✅ Success'}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                            
                            {/* Direct Content Input */}
                            <div className="input-group">
                                <label>Or paste your content directly:</label>
                                <textarea
                                    value={content}
                                    onChange={(e) => setContent(e.target.value)}
                                    placeholder="Paste your study material, notes, or any text content here..."
                                    rows={6}
                                    style={{ resize: 'vertical', minHeight: '150px' }}
                                />
                            </div>
                            
                            {/* Quiz Configuration */}
                            <div className="quiz-settings">
                                <div className="setting-card">
                                    <h3 style={{ color: 'white', marginBottom: '15px' }}>Multiple Choice Questions</h3>
                                    <div className="input-group">
                                        <label>Number of MCQs:</label>
                                        <select value={mcqCount} onChange={(e) => setMcqCount(parseInt(e.target.value))}>
                                            {[...Array(21)].map((_, i) => (
                                                <option key={i} value={i}>{i} MCQs</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>
                                
                                <div className="setting-card">
                                    <h3 style={{ color: 'white', marginBottom: '15px' }}>Short Answer Questions</h3>
                                    <div className="input-group">
                                        <label>Number of Short Questions:</label>
                                        <select value={shortCount} onChange={(e) => setShortCount(parseInt(e.target.value))}>
                                            {[...Array(16)].map((_, i) => (
                                                <option key={i} value={i}>{i} Short Questions</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>
                                
                                <div className="setting-card">
                                    <h3 style={{ color: 'white', marginBottom: '15px' }}>True/False Questions</h3>
                                    <div className="input-group">
                                        <label>Number of T/F Questions:</label>
                                        <select value={tfCount} onChange={(e) => setTfCount(parseInt(e.target.value))}>
                                            {[...Array(11)].map((_, i) => (
                                                <option key={i} value={i}>{i} T/F Questions</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>
                                
                                <div className="setting-card">
                                    <h3 style={{ color: 'white', marginBottom: '15px' }}>Difficulty Level</h3>
                                    <div className="input-group">
                                        <label>Question Difficulty:</label>
                                        <select value={difficulty} onChange={(e) => setDifficulty(e.target.value)}>
                                            <option value="easy">Easy</option>
                                            <option value="medium">Medium</option>
                                            <option value="hard">Hard</option>
                                            <option value="expert">Expert</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Generation Summary */}
                            <div className="glass" style={{ padding: '20px', margin: '30px 0', background: 'rgba(99, 102, 241, 0.1)' }}>
                                <h3 style={{ color: 'white', marginBottom: '15px' }}>Quiz Summary</h3>
                                <div style={{ color: 'rgba(255,255,255,0.9)', lineHeight: '1.6' }}>
                                    <p><strong>Total Questions:</strong> {mcqCount + shortCount + tfCount}</p>
                                    <p><strong>Breakdown:</strong> {mcqCount} MCQ, {shortCount} Short Answer, {tfCount} True/False</p>
                                    <p><strong>Difficulty:</strong> {difficulty.charAt(0).toUpperCase() + difficulty.slice(1)}</p>
                                    <p><strong>Content Length:</strong> {content.length} characters</p>
                                </div>
                            </div>
                            
                            {/* Generate Button */}
                            <div style={{ textAlign: 'center' }}>
                                <button 
                                    className="btn"
                                    onClick={generateQuiz}
                                    disabled={loading || (!content.trim() && files.length === 0)}
                                    style={{ 
                                        padding: '18px 36px', 
                                        fontSize: '18px',
                                        background: loading ? 'rgba(255,255,255,0.3)' : 'linear-gradient(45deg, #6366f1, #8b5cf6)'
                                    }}
                                >
                                    {loading ? (
                                        <>
                                            <div className="loading-spinner" style={{ width: '20px', height: '20px', margin: '0 10px 0 0' }} />
                                            Generating Quiz...
                                        </>
                                    ) : (
                                        <>🚀 Generate Quiz & Content</>
                                    )}
                                </button>
                            </div>
                        </div>
                    )}
                    
                    {/* Content & Flashcards Tab */}
                    {activeTab === 'content' && (
                        <div>
                            {/* Summary Section */}
                            <div className="glass" style={{ padding: '40px', marginBottom: '30px' }}>
                                <h2 style={{ color: 'white', marginBottom: '20px' }}>📄 Content Summary</h2>
                                <div style={{ 
                                    background: 'rgba(255, 255, 255, 0.1)', 
                                    padding: '25px', 
                                    borderRadius: '16px',
                                    color: 'white',
                                    lineHeight: '1.8',
                                    fontSize: '16px'
                                }}>
                                    {summary}
                                </div>
                                
                                <div style={{ marginTop: '25px', textAlign: 'center' }}>
                                    <button className="btn" onClick={startQuiz}>
                                        Start Quiz Now
                                    </button>
                                </div>
                            </div>
                            
                            {/* Flashcards Section */}
                            <div className="glass" style={{ padding: '40px' }}>
                                <h2 style={{ color: 'white', marginBottom: '30px' }}>🎴 Interactive Flashcards</h2>
                                <p style={{ color: 'rgba(255,255,255,0.8)', marginBottom: '30px', textAlign: 'center' }}>
                                    Click on any card to reveal the answer
                                </p>
                                
                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: '25px' }}>
                                    {flashcards.map(card => (
                                        <div 
                                            key={card.id}
                                            className={`flashcard ${flippedCards.has(card.id) ? 'flipped' : ''}`}
                                            onClick={() => flipCard(card.id)}
                                        >
                                            <div className="flashcard-content">
                                                <h3 style={{ fontSize: '1.5rem', marginBottom: '10px' }}>
                                                    {card.front}
                                                </h3>
                                                <p style={{ opacity: 0.7 }}>Click to reveal definition</p>
                                            </div>
                                            <div className="flashcard-content flashcard-back">
                                                <p style={{ fontSize: '16px', lineHeight: '1.6' }}>
                                                    {card.back}
                                                </p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Quiz Tab */}
                    {activeTab === 'quiz' && questions.length > 0 && (
                        <div>
                            {!quizMode ? (
                                /* Quiz Setup */
                                <div className="glass" style={{ padding: '40px' }}>
                                    <h2 style={{ color: 'white', marginBottom: '30px' }}>🎯 Quiz Ready</h2>
                                    
                                    <div className="stats-grid">
                                        <div className="stat-card">
                                            <div className="stat-number">{questions.length}</div>
                                            <div>Total Questions</div>
                                        </div>
                                        <div className="stat-card">
                                            <div className="stat-number">{mcqCount}</div>
                                            <div>Multiple Choice</div>
                                        </div>
                                        <div className="stat-card">
                                            <div className="stat-number">{shortCount}</div>
                                            <div>Short Answer</div>
                                        </div>
                                        <div className="stat-card">
                                            <div className="stat-number">{tfCount}</div>
                                            <div>True/False</div>
                                        </div>
                                    </div>
                                    
                                    <div style={{ textAlign: 'center', marginTop: '40px' }}>
                                        <button 
                                            className="btn success-animation"
                                            onClick={startQuiz}
                                            style={{ padding: '20px 40px', fontSize: '20px' }}
                                        >
                                            🚀 Begin Quiz
                                        </button>
                                    </div>
                                </div>
                            ) : !showResults ? (
                                /* Active Quiz */
                                <div className="glass" style={{ padding: '40px' }}>
                                    {/* Progress */}
                                    <div style={{ marginBottom: '30px' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', color: 'white', marginBottom: '15px' }}>
                                            <span style={{ fontSize: '18px' }}>Question {currentQuestion + 1} of {questions.length}</span>
                                            <span style={{ fontSize: '18px' }}>Score: {score}/{questions.length}</span>
                                        </div>
                                        <div className="progress-bar">
                                            <div 
                                                className="progress-fill"
                                                style={{ width: `${((currentQuestion + 1) / questions.length) * 100}%` }}
                                            />
                                        </div>
                                    </div>
                                    
                                    {/* Question */}
                                    <div className="quiz-question">
                                        <h2 style={{ color: 'white', marginBottom: '25px', fontSize: '1.8rem', lineHeight: '1.4' }}>
                                            {questions[currentQuestion].question}
                                        </h2>
                                        
                                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '25px', opacity: 0.7 }}>
                                            <span style={{ color: 'white' }}>Type: {questions[currentQuestion].type.toUpperCase()}</span>
                                            <span style={{ color: 'white' }}>Difficulty: {questions[currentQuestion].difficulty}</span>
                                        </div>
                                        
                                        {/* Answer Options */}
                                        {questions[currentQuestion].type !== 'short' ? (
                                            <div className="options-grid">
                                                {questions[currentQuestion].options?.map((option, index) => (
                                                    <div
                                                        key={index}
                                                        className={`option ${answers[questions[currentQuestion].id] === option ? 'selected' : ''}`}
                                                        onClick={() => selectAnswer(option)}
                                                    >
                                                        {option}
                                                    </div>
                                                ))}
                                            </div>
                                        ) : (
                                            <div className="input-group">
                                                <textarea
                                                    placeholder="Type your detailed answer here..."
                                                    value={answers[questions[currentQuestion].id] || ''}
                                                    onChange={(e) => selectAnswer(e.target.value)}
                                                    rows={6}
                                                    style={{ fontSize: '16px', lineHeight: '1.6' }}
                                                />
                                            </div>
                                        )}
                                        
                                        {/* Navigation */}
                                        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '40px' }}>
                                            <button 
                                                className="btn btn-secondary"
                                                onClick={() => setQuizMode(false)}
                                            >
                                                ← Back to Overview
                                            </button>
                                            
                                            <button 
                                                className="btn"
                                                onClick={nextQuestion}
                                                disabled={!answers[questions[currentQuestion].id]}
                                            >
                                                {currentQuestion < questions.length - 1 ? 'Next Question →' : 'Finish Quiz 🎯'}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ) : null}
                        </div>
                    )}
                    
                    {/* Results Tab */}
                    {activeTab === 'results' && showResults && (
                        <div>
                            {/* Results Overview */}
                            <div className="glass" style={{ padding: '40px', marginBottom: '30px' }}>
                                <div style={{ textAlign: 'center', marginBottom: '30px' }}>
                                    <h1 style={{ fontSize: '3rem', marginBottom: '20px' }}>🎉</h1>
                                    <h2 style={{ color: 'white', marginBottom: '15px', fontSize: '2.5rem' }}>Quiz Completed!</h2>
                                    <div style={{ 
                                        fontSize: '2rem', 
                                        fontWeight: 'bold',
                                        background: 'linear-gradient(45deg, #10b981, #3b82f6)',
                                        WebkitBackgroundClip: 'text',
                                        WebkitTextFillColor: 'transparent',
                                        marginBottom: '20px'
                                    }}>
                                        {score}/{questions.length} ({((score/questions.length)*100).toFixed(1)}%)
                                    </div>
                                </div>
                                
                                <div className="stats-grid">
                                    <div className="stat-card">
                                        <div className="stat-number">{score}</div>
                                        <div>Correct Answers</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-number">{questions.length - score}</div>
                                        <div>Incorrect</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-number">{((score/questions.length)*100).toFixed(0)}%</div>
                                        <div>Accuracy</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-number">{difficulty}</div>
                                        <div>Difficulty</div>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Focus Points for Wrong Answers */}
                            {focusPoints.length > 0 && (
                                <div className="focus-points">
                                    <h3>🎯 Focus Points - Review These Areas</h3>
                                    {focusPoints.map((point, index) => (
                                        <div key={index} style={{ marginBottom: '20px', padding: '15px 0', borderBottom: '1px solid rgba(255,255,255,0.1)' }}>
                                            <h4 style={{ color: '#fca5a5', marginBottom: '10px' }}>{point.question}</h4>
                                            <p><strong>Your Answer:</strong> {point.yourAnswer}</p>
                                            <p><strong>Correct Answer:</strong> {point.correctAnswer}</p>
                                            <p style={{ marginTop: '10px', fontStyle: 'italic' }}>{point.explanation}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                            
                            {/* Action Buttons */}
                            <div className="glass" style={{ padding: '30px', textAlign: 'center' }}>
                                <div style={{ display: 'flex', gap: '20px', justifyContent: 'center', flexWrap: 'wrap' }}>
                                    <button className="btn" onClick={() => {
                                        setQuizMode(true);
                                        setCurrentQuestion(0);
                                        setAnswers({});
                                        setScore(0);
                                        setShowResults(false);
                                    }}>
                                        🔄 Retake Quiz
                                    </button>
                                    
                                    <button className="btn btn-secondary" onClick={() => {
                                        setActiveTab('upload');
                                        setQuestions([]);
                                        setShowResults(false);
                                        setQuizMode(false);
                                        setFlashcards([]);
                                        setSummary('');
                                    }}>
                                        📝 Create New Quiz
                                    </button>
                                    
                                    <button className="btn btn-secondary" onClick={() => setActiveTab('content')}>
                                        🎴 Review Flashcards
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Loading Overlay */}
                    {loading && (
                        <div className="modal">
                            <div style={{ textAlign: 'center', color: 'white' }}>
                                <div className="loading-spinner" style={{ width: '80px', height: '80px', margin: '0 auto 30px' }} />
                                <h2 style={{ marginBottom: '15px' }}>Processing Your Content</h2>
                                <p style={{ opacity: 0.8, fontSize: '18px' }}>
                                    Extracting text, generating questions, and creating flashcards...
                                </p>
                            </div>
                        </div>
                    )}
                    
                    {/* Focus Points Modal */}
                    {showFocusPoints && (
                        <div className="modal" onClick={() => setShowFocusPoints(false)}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '25px' }}>
                                    <h2>🎯 Areas to Focus On</h2>
                                    <button className="btn btn-secondary" onClick={() => setShowFocusPoints(false)}>
                                        ✕
                                    </button>
                                </div>
                                
                                <p style={{ marginBottom: '25px', opacity: 0.9 }}>
                                    Based on your quiz performance, here are the key areas you should review:
                                </p>
                                
                                {focusPoints.map((point, index) => (
                                    <div key={index} className="focus-points" style={{ marginBottom: '25px' }}>
                                        <h4>{point.question}</h4>
                                        <div style={{ marginTop: '15px' }}>
                                            <p><strong>Your Answer:</strong> {point.yourAnswer}</p>
                                            <p><strong>Correct Answer:</strong> {point.correctAnswer}</p>
                                            <p style={{ marginTop: '10px', fontStyle: 'italic', opacity: 0.9 }}>
                                                {point.explanation}
                                            </p>
                                        </div>
                                    </div>
                                ))}
                                
                                <div style={{ textAlign: 'center', marginTop: '30px' }}>
                                    <button className="btn" onClick={() => {
                                        setShowFocusPoints(false);
                                        setActiveTab('content');
                                    }}>
                                        📚 Review Study Material
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        
        ReactDOM.render(<QuizGenPro />, document.getElementById('root'));
    </script>
</body>
</html>
