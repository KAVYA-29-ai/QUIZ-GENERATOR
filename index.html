<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {

        .btn-secondary {

        .option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);

        .option:hover {

        .option.selected {

        .option.correct {
            background: rgba(16, 185, 129, 0.2);

            background: rgba(239, 68, 68, 0.2);

        @keyframes correctBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }

        @keyframes incorrectShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }

        .progress-bar {
            width: 100%;

        .loading-overlay {

        .loading-spinner {

        .form-group {

        .file-list {
            margin-top: 20px;
        }
        
        .file-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;

        }
        
        .file-info {
            display: flex;

        }
        
        .file-name {
            font-weight: 500;

        }
        
        .file-size {

        .remove-btn {
            background: rgba(239, 68, 68, 0.2);

        @media (max-width: 768px) {
            .container { padding: 16px; }
            .header h1 { font-size: 2.5rem; }

    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const QuizGenPro = () => {
            const [activeTab, setActiveTab] = useState('upload');
            const [content, setContent] = useState('');
            const [files, setFiles] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');
            
            // Difficulty Settings
            const [difficultyDistribution, setDifficultyDistribution] = useState({
                easy: 3,
                medium: 4,
                hard: 2,
                expert: 1
            });
            
            const [questionTypes, setQuestionTypes] = useState({
                mcq: 6,
                short: 2,
                truefalse: 2
            });
            
            // Quiz State
            const [questions, setQuestions] = useState([]);
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [answers, setAnswers] = useState({});
            const [score, setScore] = useState(0);
            const [showResults, setShowResults] = useState(false);
            const [quizMode, setQuizMode] = useState(false);
            const [showAnswers, setShowAnswers] = useState(false);
            
            // Content State
            const [summary, setSummary] = useState('');
            const [flashcards, setFlashcards] = useState([]);
            const [flippedCards, setFlippedCards] = useState(new Set());
            
            const fileInputRef = useRef(null);
            
            // Enhanced PDF text extraction
            const extractTextFromPDF = async (file) => {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                    let fullText = '';
                    
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(' ');
                        fullText += pageText + '\n\n';
                    }
                    
                    return fullText.replace(/\s+/g, ' ').trim();
                } catch (error) {
                    throw new Error('Failed to extract text from PDF');
                }
            };
            
            // File upload handler
            const handleFileUpload = async (uploadedFiles) => {
                setLoading(true);
                setError('');
                const newFiles = [];
                let combinedContent = content;
                
                for (const file of uploadedFiles) {
                    try {
                        let fileContent = '';
                        
                        if (file.type === 'application/pdf') {
                            fileContent = await extractTextFromPDF(file);
                        } else if (file.type.startsWith('text/') || file.name.endsWith('.txt') || file.name.endsWith('.md')) {
                            fileContent = await file.text();
                        } else {
                            throw new Error('Unsupported file type. Please upload PDF or text files.');
                        }
                        
                        newFiles.push({
                            name: file.name,
                            type: file.type,
                            content: fileContent,
                            size: file.size
                        });
                        
                        combinedContent += '\n\n--- ' + file.name + ' ---\n\n' + fileContent;
                        
                    } catch (error) {
                        newFiles.push({
                            name: file.name,
                            type: file.type,
                            content: `Error reading ${file.name}: ${error.message}`,
                            size: file.size,
                            error: true
                        });
                    }
                }
                
                setFiles(prev => [...prev, ...newFiles]);
                setContent(combinedContent);
                setLoading(false);
                setSuccess(`Successfully uploaded ${uploadedFiles.length} file(s)`);
            };
            
            // Remove file
            const removeFile = (index) => {
                const removedFile = files[index];
                const newFiles = files.filter((_, i) => i !== index);
                
                // Remove file content from combined content
                const fileMarker = `--- ${removedFile.name} ---`;
                const contentParts = content.split(fileMarker);
                if (contentParts.length > 1) {
                    // Remove the file's content section
                    const beforeFile = contentParts[0];
                    const afterFileEnd = contentParts[1].split('--- ').slice(1).join('--- ');
                    setContent(beforeFile + (afterFileEnd ? '--- ' + afterFileEnd : ''));
                }
                
                setFiles(newFiles);
                setSuccess(`Removed file: ${removedFile.name}`);
            };
            
            // Generate quiz using Gemini API
            const generateQuiz = async () => {
                if (!content.trim() && files.length === 0) {
                    setError('Please add content or upload files first!');
                    return;
                }
                
                setLoading(true);
                setError('');
                
                try {
                    // Call the Gemini API via a serverless function
                    const response = await fetch('/.netlify/functions/generate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            content: content,
                            type: 'questions',
                            config: {
                                difficultyDistribution,
                                questionTypes
                            }
                        }),
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        setQuestions(data.data.questions);
                        setSummary(data.data.summary);
                        setFlashcards(data.data.flashcards);
                        setActiveTab('content');
                        setSuccess('Successfully generated learning materials!');
                    } else {
                        setError(data.error || 'Failed to generate content');
                        // Fallback to mock data if API fails
                        generateMockData();
                    }
                } catch (error) {
                    console.error('API Error:', error);
                    setError('API connection failed. Using mock data instead.');
                    // Fallback to mock data
                    generateMockData();
                } finally {
                    setLoading(false);
                }
            };
            
            // Fallback mock data generation
            const generateMockData = () => {
                const generatedQuestions = generateQuestionsFromContent(content);
                setQuestions(generatedQuestions);
                generateSummary(content);
                generateFlashcards(content);
                setActiveTab('content');
            };
            
            // Enhanced question generation (fallback)
            const generateQuestionsFromContent = (text) => {
                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 20);
                const words = text.split(/\s+/).filter(w => w.length > 4);
                const questions = [];
                let questionId = 1;
                
                Object.entries(difficultyDistribution).forEach(([difficulty, count]) => {
                    Object.entries(questionTypes).forEach(([type, totalCount]) => {
                        const questionsForDifficulty = Math.ceil((count / Object.values(difficultyDistribution).reduce((a, b) => a + b)) * totalCount);
                        
                        for (let i = 0; i < questionsForDifficulty && questionId <= 20; i++) {
                            const randomSentence = sentences[Math.floor(Math.random() * sentences.length)] || 'Sample content';
                            const keyWord = words[Math.floor(Math.random() * words.length)] || 'concept';
                            
                            let question = {};
                            
                            if (type === 'mcq') {
                                question = {
                                    id: questionId++,
                                    type: 'mcq',
                                    question: generateMCQQuestion(keyWord, difficulty),
                                    options: generateMCQOptions(keyWord, difficulty),
                                    correct: 'A',
                                    difficulty: difficulty,
                                    explanation: `This relates to "${keyWord}" in the provided content.`
                                };
                            } else if (type === 'truefalse') {
                                const isTrue = Math.random() > 0.5;
                                question = {
                                    id: questionId++,
                                    type: 'truefalse',
                                    question: `The content discusses "${keyWord}" as a fundamental concept.`,
                                    options: ['True', 'False'],
                                    correct: isTrue ? 'True' : 'False',
                                    difficulty: difficulty,
                                    explanation: `Based on the analysis of "${keyWord}" in the content.`
                                };
                            } else if (type === 'short') {
                                question = {
                                    id: questionId++,
                                    type: 'short',
                                    question: generateShortQuestion(keyWord, difficulty),
                                    difficulty: difficulty,
                                    explanation: `A comprehensive answer should analyze "${keyWord}" with examples.`,
                                    sampleAnswer: `${keyWord} is a key concept that plays an important role in understanding the subject matter. It connects to other ideas and provides foundational knowledge for further learning.`
                                };
                            }
                            
                            questions.push(question);
                        }
                    });
                });
                
                return questions.slice(0, 15);
            };
            
            const generateMCQQuestion = (keyWord, difficulty) => {
                const questions = {
                    easy: `What is "${keyWord}" in the context of this content?`,
                    medium: `How does "${keyWord}" relate to the main concepts?`,
                    hard: `Analyze the significance of "${keyWord}" in the material.`,
                    expert: `Evaluate the implications of "${keyWord}" beyond the given context.`
                };
                return questions[difficulty];
            };
            
            const generateMCQOptions = (keyWord, difficulty) => {
                return [
                    `A key concept related to ${keyWord}`,
                    `A supporting detail about ${keyWord}`,
                    `An example of ${keyWord}`,
                    `An unrelated term to ${keyWord}`
                ];
            };
            
            const generateShortQuestion = (keyWord, difficulty) => {
                const questions = {
                    easy: `Describe "${keyWord}" based on the content.`,
                    medium: `Explain how "${keyWord}" connects to other concepts.`,
                    hard: `Analyze the role of "${keyWord}" in the material.`,
                    expert: `Critically evaluate "${keyWord}" and its applications.`
                };
                return questions[difficulty];
            };
            
            // Generate summary (fallback)
            const generateSummary = (text) => {
                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 15);
                const keySentences = sentences.slice(0, 5);
                const wordCount = text.split(/\s+/).length;
                
                const summaryText = `## Content Overview\n\nThis material contains comprehensive information suitable for learning and assessment. The content has been processed from ${files.length} files with approximately ${wordCount} words.\n\n## Key Points\n\n${keySentences.map((s, i) => `${i + 1}. ${s.trim().substring(0, 100)}...`).join('\n')}\n\n## Analysis\n\nThe content has been analyzed to generate ${Object.values(difficultyDistribution).reduce((a, b) => a + b)} questions across multiple difficulty levels and ${flashcards.length} flashcards for comprehensive learning.`;
                
                setSummary(summaryText);
            };
            
            // Generate flashcards with enhanced content (fallback)
            const generateFlashcards = (text) => {
                const words = text.split(/\s+/).filter(w => w.length > 5 && /^[A-Za-z]+$/.test(w));
                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 20);
                const uniqueWords = [...new Set(words)].slice(0, 15);
                
                const cards = uniqueWords.map((word, index) => {
                    const relevantSentence = sentences.find(s => 
                        s.toLowerCase().includes(word.toLowerCase())
                    ) || sentences[index % sentences.length] || 'Related to the study material.';
                    
                    const categories = ['Primary Concept', 'Supporting Detail', 'Technical Term', 'Key Process', 'Important Factor'];
                    const colors = ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
                    
                    return {
                        id: index + 1,
                        front: word.charAt(0).toUpperCase() + word.slice(1),
                        back: `**Definition:** Key concept from the material\n\n**Context:** "${relevantSentence.trim().substring(0, 120)}..."\n\n**Importance:** Essential term for understanding the subject matter.\n\n**Usage:** Appears frequently in the provided content and relates to core learning objectives.`,
                        category: categories[index % categories.length],
                        color: colors[index % colors.length]
                    };
                });
                
                setFlashcards(cards);
            };
            
            // Quiz functions
            const startQuiz = () => {
                if (questions.length === 0) {
                    setError('Please generate questions first!');
                    return;
                }
                setQuizMode(true);
                setCurrentQuestion(0);
                setAnswers({});
                setScore(0);
                setShowResults(false);
                setShowAnswers(false);
                setActiveTab('quiz');
            };
            
            const selectAnswer = (answer) => {
                setAnswers(prev => ({
                    ...prev,
                    [questions[currentQuestion].id]: answer
                }));
            };
            
            const nextQuestion = () => {
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(prev => prev + 1);
                } else {
                    finishQuiz();
                }
            };
            
            const prevQuestion = () => {
                if (currentQuestion > 0) {
                    setCurrentQuestion(prev => prev - 1);
                }
            };
            
            const finishQuiz = () => {
                let finalScore = 0;
                questions.forEach(q => {
                    const userAnswer = answers[q.id];
                    if (q.type === 'short') {
                        if (userAnswer && userAnswer.length > 10) finalScore++;
                    } else {
                        if (userAnswer === q.correct) finalScore++;
                    }
                });
                setScore(finalScore);
                setShowResults(true);
                setActiveTab('results');
            };
            
            const restartQuiz = () => {
                setCurrentQuestion(0);
                setAnswers({});
                setScore(0);
                setShowResults(false);
                setShowAnswers(false);
                setQuizMode(true);
                setActiveTab('quiz');
            };
            
            // Fixed flashcard flip function
            const flipCard = (cardId) => {
                setFlippedCards(prev => {
                    const newSet = new Set(prev);
                    if (newSet.has(cardId)) {
                        newSet.delete(cardId);
                    } else {
                        newSet.add(cardId);
                    }
                    return newSet;
                });
            };
            
            // Drag and drop handlers
            const handleDrop = (e) => {
                e.preventDefault();
                e.currentTarget.classList.remove('drag-over');
                const droppedFiles = Array.from(e.dataTransfer.files);
                handleFileUpload(droppedFiles);
            };
            
            const handleDragOver = (e) => {
                e.preventDefault();
                e.currentTarget.classList.add('drag-over');
            };
            
            const handleDragLeave = (e) => {
                e.preventDefault();
                e.currentTarget.classList.remove('drag-over');
            };
            
            const updateDifficultyCount = (difficulty, count) => {
                setDifficultyDistribution(prev => ({
                    ...prev,
                    [difficulty]: Math.max(0, Math.min(10, count))
                }));
            };
            
            const updateQuestionType = (type, count) => {
                setQuestionTypes(prev => ({
                    ...prev,
                    [type]: Math.max(0, Math.min(20, count))
                }));
            };
            
            const formatFileSize = (bytes) => {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            };
            
            const currentQ = questions[currentQuestion];
            const progress = questions.length > 0 ? ((currentQuestion + 1) / questions.length) * 100 : 0;
            
            return (
                <div className="container">
                    {/* Loading Overlay */}
                    {loading && (
                        <div className="loading-overlay">
                            <div className="loading-spinner"></div>
                            <p>Processing your content...</p>
                        </div>
                    )}
                    
                    {/* Header */}
                    <div className="header">
                        <h1>QuizGen Pro</h1>
                        <p>AI-Powered Learning Assistant with Dynamic Difficulty</p>
                    </div>
                    
                    {/* Error and Success Messages */}
                    {error && (
                        <div className="error-message glass-card">
                            <strong>Error:</strong> {error}
                        </div>
                    )}
                    
                    {success && (
                        <div className="success-message glass-card">
                            <strong>Success:</strong> {success}
                        </div>
                    )}
                    
                    {/* Tab Navigation */}
                    <div className="glass-card">
                        <div className="tab-nav">
                            <button 
                                className={`tab-btn ${activeTab === 'upload' ? 'active' : ''}`}
                                onClick={() => setActiveTab('upload')}
                                disabled={loading}
                            >
                                Upload Content
                            </button>
                            <button 
                                className={`tab-btn ${activeTab === 'settings' ? 'active' : ''}`}
                                onClick={() => setActiveTab('settings')}
                                disabled={loading || (files.length === 0 && !content)}
                            >
                                Settings
                            </button>
                            <button 
                                className={`tab-btn ${activeTab === 'content' ? 'active' : ''}`}
                                onClick={() => setActiveTab('content')}
                                disabled={loading || questions.length === 0}
                            >
                                Learning Materials
                            </button>
                            <button 
                                className={`tab-btn ${activeTab === 'quiz' ? 'active' : ''}`}
                                onClick={() => quizMode ? setActiveTab('quiz') : startQuiz()}
                                disabled={loading || questions.length === 0}
                            >
                                Take Quiz
                            </button>
                            <button 
                                className={`tab-btn ${activeTab === 'results' ? 'active' : ''}`}
                                onClick={() => setActiveTab('results')}
                                disabled={loading || !showResults}
                            >
                                Results
                            </button>
                        </div>
                    </div>
                    
                    {/* Upload Tab */}
                    {activeTab === 'upload' && (
                        <div className="glass-card" style={{padding: '32px'}}>
                            <h2 style={{marginBottom: '20px'}}>Upload Study Materials</h2>
                            
                            <div 
                                className="upload-area"
                                onDrop={handleDrop}
                                onDragOver={handleDragOver}
                                onDragLeave={handleDragLeave}
                                onClick={() => fileInputRef.current?.click()}
                            >
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style={{marginBottom: '16px'}}>
                                    <path d="M14 2H6C4.9 2 4.01 2.9 4.01 4L4 20C4 21.1 4.89 22 5.99 22H18C19.1 22 20 21.1 20 20V8L14 2Z" fill="rgba(255,255,255,0.1)"/>
                                    <path d="M14 2V8H20M16 13H8M16 17H8M10 9H8" stroke="rgba(255,255,255,0.5)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                                </svg>
                                <h3 style={{marginBottom: '8px'}}>Drag & Drop Files Here</h3>
                                <p style={{color: 'rgba(255,255,255,0.6)'}}>Upload PDFs, text files, or paste content below</p>
                            </div>
                            
                            <input 
                                type="file" 
                                ref={fileInputRef}
                                style={{display: 'none'}}
                                multiple
                                accept=".pdf,.txt,.md,text/plain,application/pdf"
                                onChange={(e) => handleFileUpload(Array.from(e.target.files))}
                            />
                            
                            <div style={{marginTop: '24px'}}>
                                <h3 style={{marginBottom: '12px'}}>Or Paste Content Directly</h3>
                                <textarea 
                                    className="textarea-field"
                                    placeholder="Paste your study content here..."
                                    value={content}
                                    onChange={(e) => setContent(e.target.value)}
                                    rows="6"
                                />
                            </div>
                            
                            {files.length > 0 && (
                                <div className="file-list">
                                    <h3 style={{marginBottom: '12px'}}>Uploaded Files</h3>
                                    {files.map((file, index) => (
                                        <div key={index} className="file-item glass-card">
                                            <div className="file-info">
                                                <span className="file-name">{file.name}</span>
                                                <span className="file-size">{formatFileSize(file.size)} • {file.type}</span>
                                            </div>
                                            <button 
                                                className="remove-btn"
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    removeFile(index);
                                                }}
                                            >
                                                Remove
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                            
                            <div style={{marginTop: '24px', textAlign: 'center'}}>
                                <button 
                                    className="btn-primary"
                                    onClick={generateQuiz}
                                    disabled={loading || (files.length === 0 && !content)}
                                >
                                    Generate Learning Materials
                                </button>
                            </div>
                        </div>
                    )}
                    
                    {/* Settings Tab */}
                    {activeTab === 'settings' && (
                        <div className="glass-card" style={{padding: '32px'}}>
                            <h2 style={{marginBottom: '20px'}}>Quiz Configuration</h2>
                            
                            <div className="grid-2" style={{marginBottom: '32px'}}>
                                <div>
                                    <h3 style={{marginBottom: '16px'}}>Difficulty Distribution</h3>
                                    {Object.entries(difficultyDistribution).map(([difficulty, count]) => (
                                        <div key={difficulty} className="difficulty-selector glass-card" style={{marginBottom: '12px'}}>
                                            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                                <span style={{textTransform: 'capitalize', fontWeight: '500'}}>{difficulty}</span>
                                                <input 
                                                    type="number" 
                                                    className="difficulty-input"
                                                    value={count}
                                                    onChange={(e) => updateDifficultyCount(difficulty, parseInt(e.target.value) || 0)}
                                                    min="0"
                                                    max="10"
                                                />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                <div>
                                    <h3 style={{marginBottom: '16px'}}>Question Types</h3>
                                    {Object.entries(questionTypes).map(([type, count]) => (
                                        <div key={type} className="difficulty-selector glass-card" style={{marginBottom: '12px'}}>
                                            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                                <span style={{textTransform: 'capitalize', fontWeight: '500'}}>
                                                    {type === 'mcq' ? 'Multiple Choice' : type === 'truefalse' ? 'True/False' : 'Short Answer'}
                                                </span>
                                                <input 
                                                    type="number" 
                                                    className="difficulty-input"
                                                    value={count}
                                                    onChange={(e) => updateQuestionType(type, parseInt(e.target.value) || 0)}
                                                    min="0"
                                                    max="20"
                                                />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <div style={{textAlign: 'center'}}>
                                <button 
                                    className="btn-primary"
                                    onClick={generateQuiz}
                                    disabled={loading}
                                >
                                    Apply Settings & Generate
                                </button>
                            </div>
                        </div>
                    )}
                    
                    {/* Content Tab */}
                    {activeTab === 'content' && (
                        <div>
                            <div className="glass-card" style={{padding: '32px', marginBottom: '24px'}}>
                                <h2 style={{marginBottom: '20px'}}>Content Summary</h2>
                                <div style={{whiteSpace: 'pre-wrap', lineHeight: '1.6'}}>
                                    {summary || 'No summary available. Please generate content first.'}
                                </div>
                            </div>
                            
                            <h2 style={{marginBottom: '16px'}}>Flashcards</h2>
                            <div className="grid-3">
                                {flashcards.length > 0 ? (
                                    flashcards.map(card => (
                                        <div 
                                            key={card.id} 
                                            className={`flashcard ${flippedCards.has(card.id) ? 'flipped' : ''}`}
                                            onClick={() => flipCard(card.id)}
                                        >
                                            <div className="flashcard-front">
                                                <span className="flashcard-category" style={{backgroundColor: card.color}}>
                                                    {card.category}
                                                </span>
                                                <h3>{card.front}</h3>
                                                <p style={{marginTop: '12px', color: 'rgba(255,255,255,0.7)'}}>Click to flip</p>
                                            </div>
                                            <div className="flashcard-back">
                                                <div style={{whiteSpace: 'pre-wrap', fontSize: '14px'}} dangerouslySetInnerHTML={{__html: card.back.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}}></div>
                                            </div>
                                        </div>
                                    ))
                                ) : (
                                    <p>No flashcards available. Please generate content first.</p>
                                )}
                            </div>
                            
                            <div style={{textAlign: 'center', marginTop: '32px'}}>
                                <button className="btn-primary" onClick={startQuiz}>
                                    Start Quiz
                                </button>
                            </div>
                        </div>
                    )}
                    
                    {/* Quiz Tab */}
                    {activeTab === 'quiz' && quizMode && (
                        <div className="glass-card" style={{padding: '32px'}}>
                            {currentQ ? (
                                <>
                                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px'}}>
                                        <span style={{color: 'rgba(255,255,255,0.7)'}}>
                                            Question {currentQuestion + 1} of {questions.length}
                                        </span>
                                        <span style={{textTransform: 'capitalize', padding: '4px 12px', borderRadius: '20px', background: 'rgba(255,255,255,0.1)', fontSize: '12px'}}>
                                            {currentQ.difficulty}
                                        </span>
                                    </div>
                                    
                                    <div className="progress-bar">
                                        <div className="progress-fill" style={{width: `${progress}%`}}></div>
                                    </div>
                                    
                                    <div className="quiz-question">
                                        <h3 style={{marginBottom: '20px'}}>{currentQ.question}</h3>
                                        
                                        {currentQ.type === 'mcq' && (
                                            <div>
                                                {currentQ.options.map((option, index) => {
                                                    const optionLetter = String.fromCharCode(65 + index);
                                                    const isSelected = answers[currentQ.id] === optionLetter;
                                                    return (
                                                        <div 
                                                            key={index}
                                                            className={`option ${isSelected ? 'selected' : ''}`}
                                                            onClick={() => selectAnswer(optionLetter)}
                                                        >
                                                            <span style={{marginRight: '12px', fontWeight: 'bold'}}>{optionLetter}.</span>
                                                            {option}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                        
                                        {currentQ.type === 'truefalse' && (
                                            <div>
                                                {currentQ.options.map((option, index) => {
                                                    const isSelected = answers[currentQ.id] === option;
                                                    return (
                                                        <div 
                                                            key={index}
                                                            className={`option ${isSelected ? 'selected' : ''}`}
                                                            onClick={() => selectAnswer(option)}
                                                        >
                                                            {option}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                        
                                        {currentQ.type === 'short' && (
                                            <textarea 
                                                className="textarea-field"
                                                placeholder="Type your answer here..."
                                                value={answers[currentQ.id] || ''}
                                                onChange={(e) => selectAnswer(e.target.value)}
                                                rows="4"
                                            />
                                        )}
                                    </div>
                                    
                                    <div style={{display: 'flex', justifyContent: 'space-between'}}>
                                        <button 
                                            className="btn-secondary"
                                            onClick={prevQuestion}
                                            disabled={currentQuestion === 0}
                                        >
                                            Previous
                                        </button>
                                        <button 
                                            className="btn-primary"
                                            onClick={nextQuestion}
                                        >
                                            {currentQuestion === questions.length - 1 ? 'Finish Quiz' : 'Next Question'}
                                        </button>
                                    </div>
                                </>
                            ) : (
                                <p>No questions available. Please generate content first.</p>
                            )}
                        </div>
                    )}
                    
                    {/* Results Tab */}
                    {activeTab === 'results' && showResults && (
                        <div className="glass-card" style={{padding: '32px'}}>
                            <h2 style={{marginBottom: '20px', textAlign: 'center'}}>Quiz Results</h2>
                            
                            <div className="stats-grid">
                                <div className="stat-card glass-card">
                                    <div className="stat-value">{score}/{questions.length}</div>
                                    <div className="stat-label">Score</div>
                                </div>
                                <div className="stat-card glass-card">
                                    <div className="stat-value">{Math.round((score / questions.length) * 100)}%</div>
                                    <div className="stat-label">Percentage</div>
                                </div>
                                <div className="stat-card glass-card">
                                    <div className="stat-value">
                                        {score === questions.length ? 'Perfect!' : 
                                         score >= questions.length * 0.7 ? 'Great Job!' : 
                                         score >= questions.length * 0.5 ? 'Good Effort!' : 'Keep Practicing!'}
                                    </div>
                                    <div className="stat-label">Performance</div>
                                </div>
                            </div>
                            
                            <div style={{textAlign: 'center', marginTop: '32px'}}>
                                <button 
                                    className="btn-primary"
                                    onClick={restartQuiz}
                                    style={{marginRight: '12px'}}
                                >
                                    Try Again
                                </button>
                                <button 
                                    className="btn-secondary"
                                    onClick={() => setShowAnswers(!showAnswers)}
                                >
                                    {showAnswers ? 'Hide Answers' : 'Show Answers'}
                                </button>
                            </div>
                            
                            {showAnswers && (
                                <div style={{marginTop: '32px'}}>
                                    <h3 style={{marginBottom: '16px'}}>Question Review</h3>
                                    {questions.map((q, index) => (
                                        <div key={q.id} className="quiz-question">
                                            <h4 style={{marginBottom: '12px'}}>Q{index + 1}: {q.question}</h4>
                                            
                                            {q.type === 'mcq' && (
                                                <div>
                                                    {q.options.map((option, optIndex) => {
                                                        const optionLetter = String.fromCharCode(65 + optIndex);
                                                        const isCorrect = optionLetter === q.correct;
                                                        const isSelected = answers[q.id] === optionLetter;
                                                        
                                                        return (
                                                            <div 
                                                                key={optIndex}
                                                                className={`option ${isCorrect ? 'correct' : isSelected ? 'incorrect' : ''}`}
                                                            >
                                                                <span style={{marginRight: '12px', fontWeight: 'bold'}}>{optionLetter}.</span>
                                                                {option}
                                                                {isCorrect && <span style={{marginLeft: '8px', color: '#10b981'}}>✓ Correct</span>}
                                                                {!isCorrect && isSelected && <span style={{marginLeft: '8px', color: '#ef4444'}}>✗ Your Answer</span>}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                            
                                            {q.type === 'truefalse' && (
                                                <div>
                                                    {q.options.map((option, optIndex) => {
                                                        const isCorrect = option === q.correct;
                                                        const isSelected = answers[q.id] === option;
                                                        
                                                        return (
                                                            <div 
                                                                key={optIndex}
                                                                className={`option ${isCorrect ? 'correct' : isSelected ? 'incorrect' : ''}`}
                                                            >
                                                                {option}
                                                                {isCorrect && <span style={{marginLeft: '8px', color: '#10b981'}}>✓ Correct</span>}
                                                                {!isCorrect && isSelected && <span style={{marginLeft: '8px', color: '#ef4444'}}>✗ Your Answer</span>}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                            
                                            {q.type === 'short' && (
                                                <div>
                                                    <div style={{marginBottom: '12px'}}>
                                                        <strong>Your Answer:</strong> {answers[q.id] || 'No answer provided'}
                                                    </div>
                                                    <div>
                                                        <strong>Sample Answer:</strong> {q.sampleAnswer}
                                                    </div>
                                                </div>
                                            )}
                                            
                                            <div style={{marginTop: '12px', padding: '12px', background: 'rgba(255,255,255,0.05)', borderRadius: '8px'}}>
                                                <strong>Explanation:</strong> {q.explanation}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };
        
        ReactDOM.render(<QuizGenPro />, document.getElementById('root'));
    </script>
</body>
</html>
